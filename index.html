<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#f2f2f7" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
        />
        <title>MAppEwi</title>
        <style>
            /* Cho phép --tint-rgb chuyển màu mượt khi đổi bài */
            @property --tint-rgb {
              syntax: "<number>#";
              inherits: true;
              initial-value: 232, 228, 239;
            }
            @property --bg-top  { syntax: "<number>#"; inherits: true; initial-value: 110, 120, 170; }
            @property --bg-edge { syntax: "<number>#"; inherits: true; initial-value: 130, 140, 190; }
            @property --bg-mid  { syntax: "<number>#"; inherits: true; initial-value: 170, 180, 225; }
            @property --glow1   { syntax: "<number>#"; inherits: true; initial-value: 190, 195, 230; }
            @property --glow2   { syntax: "<number>#"; inherits: true; initial-value: 200, 190, 230; }

            :root {
              --bg: #f2f2f7;
              --bg2: #e5e5ea;
              --surface: #ffffff;
              --surface2: #f5f5f7;
              --text: #1c1c1e;
              --sub: #6e6e73;
              --muted: #8e8e93;
              --accent: #ff2d55;
              --accent2: #bf5af2;
              --green: #30d158;
              --track: rgba(0,0,0,.12);
              --glass: rgba(255,255,255,.85);
              --shadow: 0 12px 40px rgba(0,0,0,.12);
              color-scheme: light;
            }

            *, *::before, *::after { box-sizing: border-box; }
            html, body { height: 100%; margin: 0; }
            body {
              background: var(--bg);
              color: var(--text);
              font-family: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
              -webkit-font-smoothing: antialiased;
              -webkit-tap-highlight-color: transparent;
              overflow: hidden;
              user-select: none;
              transition: background-color .6s ease;
            }
            button {
              background: none; border: 0; color: inherit; padding: 0;
              cursor: pointer; font: inherit; -webkit-appearance: none;
            }
            [hidden] { display: none !important; }
            svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
            img { display: block; max-width: 100%; }

            .app {
              position: relative;
              height: 100%;
              max-width: 430px;
              margin: 0 auto;
              overflow: hidden;
              background: var(--bg);
            }

            /* ========== HOME ========== */
            .home {
              position: absolute; inset: 0;
              --tabh: calc(56px + env(safe-area-inset-bottom, 0px));
              padding-top: env(safe-area-inset-top, 0px);
              display: flex; flex-direction: column;
              transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .4s;
            }
            .app.show .home {
              transform: scale(.94) translateY(-8px);
              opacity: .35;
              pointer-events: none;
            }

            /* Thanh điều hướng dưới cùng: Tôi / Tìm nhạc / Tra từ (chỉ icon) */
            .tabbar {
              position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
              height: var(--tabh); padding-bottom: env(safe-area-inset-bottom, 0px);
              background: var(--glass);
              backdrop-filter: blur(24px) saturate(180%);
              -webkit-backdrop-filter: blur(24px) saturate(180%);
            }
            .tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); height: 56px; }
            .tp {
              position: absolute; left: 0; top: 11px; width: calc(100% / 3); height: 34px;
              pointer-events: none; transition: transform .4s cubic-bezier(.32,.72,0,1);
            }
            .tp::before {
              content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
              width: 64px; margin-left: -32px; border-radius: 17px;
              background: rgba(255,45,85,.12);
            }
            .tabs[data-p="1"] .tp { transform: translateX(100%); }
            .tabs[data-p="2"] .tp { transform: translateX(200%); }
            .tab {
              position: relative; display: grid; place-items: center;
              color: var(--muted); transition: color .25s, transform .18s;
            }
            .tab svg { width: 26px; height: 26px; transition: stroke-width .2s; }
            .tab:active { transform: scale(.88); }
            .tab.on { color: var(--accent); }
            .tab.on svg { stroke-width: 2.1; }

            .sbox {
              display: flex; align-items: center; gap: 10px;
              margin: 14px 20px 8px; padding: 0 14px;
              height: 44px; border-radius: 12px;
              background: var(--surface2);
            }
            .sbox svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
            .sbox input {
              flex: 1; min-width: 0; background: none; border: 0; outline: 0;
              color: var(--text); font: inherit; font-size: 16px;
            }
            .sbox input::placeholder { color: var(--muted); }
            .sbox button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }

            .hbody {
              flex: 1; min-height: 0; overflow-y: auto;
              padding: 4px 0 calc(150px + env(safe-area-inset-bottom, 0px));
              -webkit-overflow-scrolling: touch;
            }
            .sh {
              padding: 18px 20px 8px;
              font-weight: 700; font-size: 18px;
              display: flex; align-items: baseline; gap: 8px;
            }
            .sh small { color: var(--sub); font-weight: 500; font-size: 13px; }

            .cards {
              display: flex; gap: 12px; overflow-x: auto;
              padding: 4px 20px 12px;
              scrollbar-width: none;
            }
            .cards::-webkit-scrollbar { display: none; }

            .pc {
              flex: none; width: 140px; height: 140px;
              border-radius: 14px; padding: 14px;
              text-align: left; display: flex; flex-direction: column;
              justify-content: flex-end; gap: 3px;
              position: relative; overflow: hidden;
              transition: transform .18s;
              box-shadow: 0 4px 16px rgba(0,0,0,.12);
            }
            .pc::after {
              content: ""; position: absolute; inset: 0;
              background: linear-gradient(to top, rgba(0,0,0,.45) 0%, transparent 55%);
              pointer-events: none;
            }
            .pc:active { transform: scale(.96); }
            .pc b, .pc small { position: relative; z-index: 1; }
            .pc b { font-size: 15px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .pc small { color: rgba(255,255,255,.8); font-size: 12px; }
            .pc.new {
              background: var(--surface2) !important;
              align-items: center; justify-content: center;
              box-shadow: none; border: 1.5px dashed var(--track);
            }
            .pc.new::after { display: none; }
            .pc.new b { font-size: 28px; font-weight: 300; color: var(--sub); }
            .pc.new small { color: var(--sub); }

            .pc-wrap {
              position: relative; flex: none; width: 140px; height: 140px;
            }
            .pc-wrap .pc { width: 100%; height: 100%; }
            .pc-del {
              position: absolute; top: 6px; right: 6px; z-index: 3;
              width: 28px; height: 28px; border-radius: 50%;
              background: rgba(0,0,0,.45); color: #fff;
              font-size: 18px; line-height: 1; font-weight: 400;
              display: grid; place-items: center;
              backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
              opacity: .85; transition: opacity .15s, transform .15s, background .15s;
            }
            .pc-del:active { opacity: 1; transform: scale(.9); background: #ff2d55; }

            .vocab-hint {
              padding: 48px 28px; text-align: center; color: var(--sub);
              font-size: 14px; line-height: 1.55;
            }
            .vocab-hint b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
            .vocab-hint em { font-style: normal; color: var(--accent2); font-weight: 500; }
            .vocab-hint-ico {
              width: 56px; height: 56px; margin: 0 auto 14px;
              border-radius: 16px; background: var(--surface2);
              display: grid; place-items: center;
              font-size: 26px; font-weight: 600; color: var(--accent2);
            }
            .home-vlist { padding: 4px 20px 24px; }
            .home-vlist .vhead {
              position: sticky; top: 0; background: var(--bg); z-index: 1;
            }

            .row {
              display: flex; align-items: center; gap: 14px;
              padding: 10px 20px; cursor: pointer;
              transition: background .15s;
            }
            .row:active { background: var(--surface2); }
            .row.cur { background: var(--surface2); }
            .row-cover {
              width: 48px; height: 48px; border-radius: 8px; flex: none;
              box-shadow: 0 2px 8px rgba(0,0,0,.1);
              object-fit: cover; background: var(--surface2);
            }
            .row-info { flex: 1; min-width: 0; }
            .row-info b {
              display: block; font-size: 15px; font-weight: 500;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            }
            .row-info small { color: var(--sub); font-size: 13px; }
            .row-dur { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
            .empty { padding: 32px 24px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.5; }

            /* Mini player */
            .mini {
              position: absolute; left: 0; right: 0; bottom: var(--tabh);
              height: 64px; display: flex; align-items: center; gap: 12px;
              padding: 0 12px; border-radius: 20px 20px 0 0;
              background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
              -webkit-backdrop-filter: blur(24px) saturate(180%);
              box-shadow: var(--shadow);
              cursor: pointer; z-index: 2; overflow: hidden;
              border: 0; border-top: 1px solid rgba(0,0,0,.06); border-bottom: 1px solid rgba(0,0,0,.05);
            }
            .mc {
              width: 48px; height: 48px; border-radius: 10px; flex: none;
              box-shadow: 0 2px 8px rgba(0,0,0,.12);
              object-fit: cover; background: var(--surface2);
            }
            .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
            .mt b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .mt small { color: var(--sub); font-size: 12px; }
            .mini-btns { display: flex; align-items: center; gap: 2px; }
            .mini button {
              width: 42px; height: 42px; display: grid; place-items: center;
            }
            .mini button svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
            .mp {
              position: absolute; left: 0; right: 0; top: 0; height: 2.5px;
              background: var(--track);
            }
            .mp i {
              display: block; height: 100%; background: var(--text); width: 0;
              border-radius: 0 2px 2px 0;
              transition: none;
            }

            /* ========== NOW PLAYING – light ========== */
            .np {
              position: absolute; inset: 0; z-index: 3;
              display: flex; flex-direction: column; overflow: hidden;
              --tint-rgb: 232,228,239;
              background: rgb(var(--tint-rgb));
              transform: translateY(105%);
              visibility: hidden;
              transition: transform .5s cubic-bezier(.32,.72,0,1), visibility 0s .5s, --tint-rgb .9s ease, --bg-top .9s ease, --bg-edge .9s ease, --bg-mid .9s ease, --glow1 .9s ease, --glow2 .9s ease;
              color: #2c2c2e;
            }
            .app.show .np {
              transform: none; visibility: visible;
              transition: transform .5s cubic-bezier(.32,.72,0,1), --tint-rgb .9s ease, --bg-top .9s ease, --bg-edge .9s ease, --bg-mid .9s ease, --glow1 .9s ease, --glow2 .9s ease;
            }

            /* Nền: các lớp màu lấy từ ảnh bìa. Đầu nền cùng tông với phần đầu ảnh, đoạn giữa nối liền
               với mép dưới ảnh (ảnh mờ dần vào đúng màu này), cuối chuyển sang tông sáng để chữ dễ đọc.
               Màu do JS tính (buildTheme) và đổi mượt nhờ @property. */
            .bg-mesh {
              position: absolute; inset: 0; z-index: 0;
              pointer-events: none;
              background:
                radial-gradient(90% 30% at 92% 70%, rgba(var(--glow2), .42) 0%, transparent 100%),
                radial-gradient(95% 32% at 6% 90%, rgba(var(--glow1), .40) 0%, transparent 100%),
                linear-gradient(180deg,
                  rgb(var(--bg-top)) 0,
                  rgb(var(--bg-edge)) 38%,
                  rgb(var(--bg-mid)) 58%,
                  rgb(var(--tint-rgb)) 76%,
                  rgb(var(--tint-rgb)) 100%);
            }

            /* Nền: ảnh bìa mờ xoay chậm – độ nhạt đặt trong setCover */
            .bg-spin {
              position: absolute; z-index: 0; pointer-events: none;
              left: 50%; top: 50%;
              width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax;
              background-size: cover; background-position: center; background-repeat: no-repeat;
              filter: blur(18px) saturate(1.35);
              opacity: 0; transition: opacity .8s ease;
              animation: bgspin 80s linear infinite;
              will-change: transform;
            }
            .app:not(.show) .bg-spin { animation-play-state: paused; }
            @keyframes bgspin { to { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) { .bg-spin { animation: none; } }

            /* Ảnh bìa vuông, rộng hết màn hình, đặt giữa vùng phía trên tên bài. Hai mép trên/dưới tan dần
               vào nền (mask); nền phía sau giữ nguyên. */
            .cover-bg {
              --cw: min(100vw, 430px);
              --sat: env(safe-area-inset-top, 0px);
              --sab: env(safe-area-inset-bottom, 0px);
              position: absolute; z-index: 0; overflow: hidden;
              left: 50%; width: var(--cw); height: var(--cw);
              margin-left: calc(var(--cw) / -2);
              top: calc((100% + var(--sat) - var(--sab) - 246px) / 2);
              margin-top: calc(var(--cw) / -2);
              -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 10%, #000 28%, #000 48%, rgba(0,0,0,.45) 74%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 10%, #000 28%, #000 48%, rgba(0,0,0,.45) 74%, transparent 100%);
            }
            .cover-inner {
              position: absolute; inset: 0;
              background-size: cover;
              background-position: center;
              background-repeat: no-repeat;
            }
            .cover-fallback {
              position: absolute; inset: 0;
              background:
                radial-gradient(ellipse 80% 60% at 50% 28%, var(--c1) 0%, transparent 55%),
                radial-gradient(circle at 22% 35%, var(--c2) 0 18%, transparent 45%),
                radial-gradient(circle at 78% 22%, var(--c3) 0 14%, transparent 40%),
                radial-gradient(circle at 65% 55%, var(--c4) 0 12%, transparent 38%),
                radial-gradient(ellipse at 50% 85%, var(--wash), transparent 55%),
                linear-gradient(180deg, #eae6f0 0%, #d9d2e4 40%, #cfc6db 100%);
            }

            .top {
              position: absolute; top: 0; left: 0; right: 0;
              display: flex; align-items: center; justify-content: space-between;
              padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0;
              z-index: 2;
            }
            .top-left, .top-right {
              display: flex; align-items: center; gap: 4px;
            }
            .top button {
              width: 40px; height: 40px; display: grid; place-items: center;
              border-radius: 50%;
              color: rgba(40,40,50,.75);
            }
            .top button:active { background: rgba(0,0,0,.06); }
            .top svg { width: 22px; height: 22px; stroke-width: 1.6; }
            .top .status {
              display: flex; align-items: center; gap: 5px;
              font-size: 12px; font-weight: 500;
              padding: 5px 10px; border-radius: 16px;
              background: rgba(255,255,255,.55);
              color: rgba(40,40,50,.7);
              backdrop-filter: blur(8px);
              -webkit-backdrop-filter: blur(8px);
            }
            .status.fd { opacity: 0; transition: opacity .2s; }
            .status i {
              width: 6px; height: 6px; border-radius: 50%;
              background: #30d158;
              box-shadow: 0 0 0 2.5px rgba(48,209,88,.25);
            }
            .status.off i { background: rgba(0,0,0,.25); box-shadow: none; }
            .top button, .top .status { transition: color .5s, background-color .5s; }
            /* Nền đầu tối (ảnh bìa tối) → icon và nhãn chuyển sang màu sáng */
            .np[data-top="dark"] .top button { color: rgba(255,255,255,.9); }
            .np[data-top="dark"] .top button:active { background: rgba(255,255,255,.16); }
            .np[data-top="dark"] .top .status { background: rgba(255,255,255,.2); color: rgba(255,255,255,.92); }
            .np[data-top="dark"] .status.off i { background: rgba(255,255,255,.55); }

            .np-bottom {
              position: relative;
              z-index: 1;
              margin-top: auto;
              padding: 28px 0 calc(14px + env(safe-area-inset-bottom, 0px));
              background: linear-gradient(
                to top,
                rgba(var(--tint-rgb), .68) 0%,
                rgba(var(--tint-rgb), .45) 40%,
                rgba(var(--tint-rgb), .15) 78%,
                transparent 100%
              );
              color: #fff;
            }

            .info {
              padding: 0 24px 6px;
              text-align: left;
            }
            .info h1 {
              margin: 0;
              font-size: 22px;
              font-weight: 700;
              letter-spacing: -.2px;
              color: #1c1c1e;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            }
            .artist-row {
              display: flex;
              align-items: center;
              flex-wrap: wrap;
              gap: 6px;
              margin-top: 6px;
            }
            .artist {
              font-size: 14px;
              font-weight: 500;
              color: #48484e;
            }

            /* Icon action row – chỉ icon, gọn */
            .icon-row {
              display: flex;
              justify-content: space-around;
              align-items: center;
              padding: 12px 20px 4px;
            }
            .icon-row button {
              display: flex;
              align-items: center;
              justify-content: center;
              width: 48px;
              height: 48px;
              border-radius: 14px;
              color: #48484e;
              position: relative;
              transition: background .15s, color .15s, transform .15s;
            }
            .icon-row button:active { background: rgba(0,0,0,.06); transform: scale(.92); }
            .icon-row svg {
              width: 24px;
              height: 24px;
              stroke-width: 1.7;
            }
            .icon-row .liked svg {
              stroke: #ff2d55;
              fill: #ff2d55;
            }

            /* Progress – smooth */
            .bar {
              padding: 10px 24px 0;
            }
            .seek {
              position: relative;
              height: 28px;
              display: flex;
              align-items: center;
              touch-action: none;
              cursor: pointer;
            }
            .seek::before {
              content: "";
              position: absolute;
              left: 0; right: 0;
              height: 4px;
              border-radius: 2px;
              background: rgba(0,0,0,.1);
            }
            .fill {
              position: absolute;
              left: 0;
              height: 4px;
              border-radius: 2px;
              background: #3a3a3c;
              width: 0;
              pointer-events: none;
              will-change: width;
            }
            .knob {
              position: absolute;
              width: 14px;
              height: 14px;
              margin-left: -7px;
              border-radius: 50%;
              background: #3a3a3c;
              box-shadow: 0 1px 4px rgba(0,0,0,.25);
              left: 0;
              pointer-events: none;
              will-change: left;
              transition: transform .15s;
            }
            .seek:active .knob { transform: scale(1.4); }
            .times {
              display: flex;
              justify-content: space-between;
              font-size: 11px;
              margin-top: 2px;
              font-variant-numeric: tabular-nums;
              font-weight: 500;
              color: #5b5b62;
            }

            /* Main controls */
            .ctrl {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 6px 28px 8px;
            }
            .ctrl button {
              width: 48px;
              height: 48px;
              display: grid;
              place-items: center;
              border-radius: 50%;
              color: #2c2c2e;
              transition: background .15s, transform .15s;
            }
            .ctrl button:active { background: rgba(0,0,0,.06); }
            .ctrl svg { width: 26px; height: 26px; stroke-width: 1.7; }
            .ctrl .fl svg { fill: currentColor; stroke: none; }
            .ctrl .on { color: #ff2d55; }
            .ctrl .play {
              width: 56px;
              height: 56px;
              background: none;
              color: #1c1c1e;
            }
            .ctrl .play:active { transform: scale(.9); background: rgba(0,0,0,.06); }
            .ctrl .play svg { width: 32px; height: 32px; fill: currentColor; stroke: none; }

            .promo {
              margin: 4px 20px 0;
              padding: 8px 14px;
              border-radius: 10px;
              background: rgba(255,255,255,.55);
              display: flex;
              align-items: center;
              gap: 8px;
              font-size: 12px;
              color: #6e6e73;
              border: 1px solid rgba(0,0,0,.04);
            }
            .promo span { flex: 1; }
            .promo b { color: #b07a00; font-weight: 600; }

            /* Từ tên bài trở xuống: nền tối cùng tông với ảnh, chữ & icon sáng */
            .np .info h1 { color: #fff; font-size: 24px; text-shadow: 0 1px 10px rgba(0,0,0,.3); }
            .np .artist { color: rgba(255,255,255,.75); text-shadow: 0 1px 8px rgba(0,0,0,.3); }
            .np .icon-row button { color: rgba(255,255,255,.78); }
            .np .icon-row button:active, .np .ctrl button:active { background: rgba(255,255,255,.12); }
            .np .times { color: rgba(255,255,255,.5); }
            .np .seek::before { background: rgba(255,255,255,.22); }
            .np .fill, .np .knob { background: #fff; }
            .np .knob { box-shadow: 0 1px 4px rgba(0,0,0,.35); }
            .np .ctrl button { color: rgba(255,255,255,.88); }
            .np .ctrl .on { color: #ff2d55; }
            .np .ctrl .play { width: 68px; height: 68px; color: #fff; background: none; }
            .np .ctrl .play:active { background: none; transform: scale(.9); }
            .np .ctrl .play svg { width: 42px; height: 42px; }
            .np .promo { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.08); color: rgba(255,255,255,.6); }
            .np .promo b { color: #f5c451; }

            /* Animations */
            .nx { animation: inR .4s cubic-bezier(.32,.72,0,1); }
            .pv { animation: inL .4s cubic-bezier(.32,.72,0,1); }
            .cv { animation: cv .55s cubic-bezier(.32,.72,0,1); }
            .icn { animation: icn .22s ease; }
            @keyframes inR { from { opacity: 0; transform: translateX(24px); } }
            @keyframes inL { from { opacity: 0; transform: translateX(-24px); } }
            @keyframes cv { from { opacity: 0; transform: scale(1.06); } }
            @keyframes icn { from { opacity: 0; transform: scale(.55); } }

            /* ========== SHEET ========== */
            .sheet {
              position: absolute; inset: 0;
              display: flex; align-items: flex-end;
              background: rgba(0,0,0,0); z-index: 5;
              visibility: hidden;
              transition: background .3s, visibility 0s .35s;
            }
            .sheet.open {
              background: rgba(0,0,0,.08); visibility: visible;
              transition: background .3s;
            }
            .pane {
              width: 100%; max-height: 78%;
              display: flex; flex-direction: column;
              background: rgba(255,255,255,.62);
              backdrop-filter: blur(10px) saturate(160%);
              -webkit-backdrop-filter: blur(10px) saturate(160%);
              border-radius: 20px 20px 0 0;
              transform: translateY(100%);
              transition: transform .4s cubic-bezier(.32,.72,0,1);
              padding-bottom: env(safe-area-inset-bottom, 0px);
              box-shadow: 0 -8px 40px rgba(0,0,0,.15);
            }
            .pane.tall { height: 78%; }
            .pane .chip { background: rgba(0,0,0,.06); }
            .pane .chip.on { background: var(--text); }
            .pane .add input { background: rgba(0,0,0,.06); }
            .pane .row.cur, .pane .row:active { background: rgba(0,0,0,.06); }
            .pane .vhead { background: rgba(255,255,255,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
            .sheet.open .pane { transform: none; }
            .grab {
              width: 36px; height: 4px; border-radius: 2px;
              background: var(--track); margin: 10px auto 4px; flex: none;
            }
            .hd {
              display: flex; justify-content: space-between; align-items: baseline;
              gap: 10px; padding: 8px 20px 6px;
              font-weight: 700; font-size: 17px; flex: none;
            }
            .hd small { font-weight: 500; color: var(--sub); font-size: 13px; }
            .chips {
              display: flex; gap: 8px; overflow-x: auto;
              padding: 4px 20px 10px; flex: none; scrollbar-width: none;
            }
            .chips::-webkit-scrollbar { display: none; }
            .chip {
              flex: none; padding: 7px 14px; border-radius: 20px;
              background: var(--surface2); font-size: 13px; font-weight: 500;
              transition: background .25s cubic-bezier(.32,.72,0,1), color .25s, transform .2s;
            }
            .chip:active { transform: scale(.94); }
            .chip.on { background: var(--text); color: var(--bg); }
            .body {
              flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px;
              -webkit-overflow-scrolling: touch;
              transition: opacity .2s ease, transform .25s cubic-bezier(.32,.72,0,1);
            }
            .body.sw { opacity: 0; transform: translateY(8px); }
            .sheet .row {
              opacity: 0; transform: translateY(10px);
              animation: rise .35s forwards;
              animation-delay: calc(var(--k, 0) * 35ms + 80ms);
            }
            .na .row { animation: none; opacity: 1; transform: none; }
            @keyframes rise { to { opacity: 1; transform: none; } }

            .tm { display: flex; align-items: center; gap: 8px; flex: none; }
            .tm button { width: 28px; height: 28px; color: var(--muted); display: grid; place-items: center; }
            .ck {
              width: 22px; height: 22px; border-radius: 50%;
              border: 1.5px solid var(--muted); display: grid; place-items: center;
              font-size: 12px; color: #fff; flex: none;
              transition: background .2s, border-color .2s;
            }
            .ck.on { background: var(--accent); border-color: var(--accent); }
            .add {
              display: flex; gap: 8px; padding: 8px 20px;
            }
            .add input {
              flex: 1; min-width: 0; background: var(--surface2); border: 0;
              border-radius: 12px; padding: 12px 14px; color: var(--text);
              font: inherit; font-size: 15px; outline: 0;
            }
            .add button {
              padding: 0 16px; border-radius: 12px;
              background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px;
            }

            /* Vocab list in sheet – Trung / Pinyin / Việt */
            .vlist { padding: 4px 20px 24px; }
            .vhead {
              display: grid;
              grid-template-columns: 1fr 1.15fr 1fr;
              gap: 8px;
              padding: 6px 4px 10px;
              font-size: 11px;
              font-weight: 600;
              color: var(--muted);
              text-transform: uppercase;
              letter-spacing: .4px;
              border-bottom: 1px solid var(--track);
              position: sticky;
              top: 0;
              background: var(--surface);
              z-index: 1;
            }
            .vitem {
              display: grid;
              grid-template-columns: 1fr 1.15fr 1fr;
              gap: 8px;
              padding: 12px 4px;
              border-bottom: 1px solid rgba(0,0,0,.05);
              font-size: 14px;
              line-height: 1.4;
              opacity: 0;
              transform: translateY(8px);
              animation: rise .35s forwards;
              animation-delay: calc(var(--k, 0) * 28ms + 60ms);
            }
            .vitem:last-child { border-bottom: 0; }
            .na .vitem { animation: none; opacity: 1; transform: none; }
            .vitem .zh { font-weight: 600; color: var(--text); font-size: 15px; }
            .vitem .py { color: var(--sub); font-style: italic; font-size: 13px; }
            .vitem .vi { color: var(--sub); font-size: 13px; }
            .lytxt {
              padding: 8px 24px 32px; font-size: 17px; line-height: 1.85;
              white-space: pre-wrap; user-select: text; -webkit-user-select: text;
              color: var(--text);
            }
            .lytxt .singer { color: var(--accent2); font-weight: 600; font-size: 13px; margin-top: 16px; display: block; }

            .toast {
              position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px));
              transform: translate(-50%, 12px);
              background: var(--text); color: var(--bg);
              padding: 10px 18px; border-radius: 20px;
              font-size: 13px; font-weight: 500;
              opacity: 0; pointer-events: none;
              transition: opacity .25s, transform .25s; z-index: 9;
              white-space: nowrap; box-shadow: var(--shadow);
            }
            .toast.on { opacity: 1; transform: translate(-50%, 0); }

            audio { display: none; }

            @media (max-height: 700px) {
              .icon-row { padding-top: 4px; }
              .bar { padding-top: 4px; }
              .ctrl { padding-top: 2px; }
            }
        </style>

                                  // ----- YouTube IFrame Player (ẩn video, phát audio qua player của app) -----
                                  var ytPlayer = null, ytReady = false, ytQueue = [], ytApiLoading = false;
                                  function ensureYT(cb) {
                                    if (ytReady && ytPlayer) { cb(); return; }
                                    ytQueue.push(cb);
                                    loadYTApi();
                                  }
                                  function loadYTApi() {
                                    if (window.YT && window.YT.Player) { initYTPlayer(); return; }
                                    if (ytApiLoading) return;
                                    ytApiLoading = true;
                                    var tag = document.createElement("script");
                                    tag.src = "https://www.youtube.com/iframe_api";
                                    // Trước đây nếu script này tải lỗi (mạng chặn, adblock, mở file trực tiếp...) thì
                                    // ytApiLoading cứ kẹt ở true mãi mãi -> mọi lần bấm Play sau đó đều im lặng,
                                    // không có cách nào thử lại ngoài tải lại trang. Giờ báo lỗi rõ và cho thử lại.
                                    tag.onerror = function () {
                                      ytApiLoading = false;
                                      toast("Không tải được trình phát YouTube – kiểm tra mạng rồi bấm Play lại");
                                    };
                                    document.head.appendChild(tag);
                                    setTimeout(function () {
                                      if (!ytReady && !(window.YT && window.YT.Player)) {
                                        ytApiLoading = false;
                                        toast("Không kết nối được tới YouTube – kiểm tra mạng (hoặc tắt trình chặn quảng cáo) rồi bấm Play lại");
                                      }
                                    }, 10000);
                                  }
                                  window.onYouTubeIframeAPIReady = function () { initYTPlayer(); };
                                  function initYTPlayer() {
                                    if (ytPlayer) return;
                                    ytPlayer = new YT.Player("ytplayer", {
                                      height: "2",
                                      width: "2",
                                      playerVars: {
                                        autoplay: 0,
                                        controls: 0,
                                        disablekb: 1,
                                        fs: 0,
                                        modestbranding: 1,
                                        rel: 0,
                                        playsinline: 1
                                      },
                                      events: {
                                        onReady: function () {
                                          ytReady = true;
                                          var q = ytQueue;
                                          ytQueue = [];
                                          q.forEach(function (fn) { try { fn(); } catch (e) {} });
                                        },
                                        onStateChange: onYTStateChange,
                                        onError: onYTError
                                      }
                                    });
                                  }
                                  function onYTStateChange(e) {
                                    if (!ytMode) return;
                                    if (e.data === YT.PlayerState.ENDED) { step(1); return; }
                                    if (e.data === YT.PlayerState.PLAYING) {
                                      clearTimeout(ytWatchdog);
                                      var d = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
                                      if (d && isFinite(d)) {
                                        ytDuration = d;
                                        tracks[i].d = Math.round(d);
                                        paint();
                                      }
                                    }
                                  }
                                  // Trước đây không bắt lỗi của YouTube Player -> khi 1 video không thể phát được
                                  // (chủ video tắt tính năng nhúng, video bị gỡ, bị chặn theo khu vực...) thì app
                                  // chỉ đứng im ở 00:00 mà không báo gì, trông như "không chạy nhạc". Hàm này báo rõ lý do.
                                  function onYTError(e) {
                                    if (!ytMode) return;
                                    var msg;
                                    switch (e.data) {
                                      case 2:
                                        msg = "ID video YouTube không hợp lệ";
                                        break;
                                      case 5:
                                        msg = "Lỗi trình phát HTML5 của YouTube";
                                        break;
                                      case 100:
                                        msg = "Video đã bị xoá hoặc ở chế độ riêng tư";
                                        break;
                                      case 101:
                                      case 150:
                                        msg = "Video này không cho phép phát ở ứng dụng khác (chủ video đã tắt nhúng) – hãy thử bài khác";
                                        break;
                                      default:
                                        msg = "Không phát được video YouTube (lỗi " + e.data + ")";
                                    }
                                    toast(msg);
                                    setPlaying(false, true);
                                  }

                                  function playYT(vid) {
                                    var y = null, n;
                                    for (n = 0; n < ytResults.length; n++) {
                                      if (ytResults[n].id === vid) { y = ytResults[n]; break; }
                                    }
                                    if (!y) return;
                                    var idx = -1;
                                    for (n = 0; n < tracks.length; n++) {
                                      if (tracks[n].yt && tracks[n].ytId === vid) { idx = n; break; }
                                    }
                                    if (idx < 0) {
                                      tracks.push({
                                        t: y.title,
                                        a: y.channel,
                                        py: "",
                                        d: 0,
                                        src: [],
                                        img: y.thumb,
                                        c: ["rgba(200,170,230,.55)", "rgba(160,180,230,.5)", "rgba(220,170,200,.45)", "rgba(180,160,220,.4)"],
                                        w: "rgba(140,120,180,.45)",
                                        vocab: [],
                                        yt: true,
                                        ytId: vid
                                      });
                                      idx = tracks.length - 1;
                                    }
                                    playTrack(idx);
                                  }

                                  function rowY(y, n) {
                                    var thumb = y.thumb
                                      ? '<img class="row-cover" src="' + esc(y.thumb) + '" alt="" />'
                                      : '<div class="row-cover" style="background:linear-gradient(135deg,#c7c7cc,#8e8e93)"></div>';
                                    return (
                                      '<div class="row" data-a="ytplay" data-k="' + esc(y.id) + '" style="--k:' + n + '">' +
                                      thumb +
                                      '<div class="row-info"><b>' + esc(y.title) + "</b><small>" + esc(y.channel) + "</small></div>" +
                                      '<span class="row-dur">YouTube</span></div>'
                                    );
                                  }
                                  // ========== HOME ==========
                                  function rowT(k, n) {
                                    var tr = tracks[k];
                                    var coverHtml = tr.img
                                      ? '<img class="row-cover" src="' + esc(tr.img) + '" alt="" />'
                                      : '<div class="row-cover" style="background:linear-gradient(135deg,' + tr.c[0] + ',' + tr.w + ')"></div>';
                                    return (
                                      '<div class="row' + (k === i ? " cur" : "") + '" data-a="hplay" data-k="' + k + '" style="--k:' + n + '">' +
                                      coverHtml +
                                      '<div class="row-info"><b>' + esc(tr.t) + '</b><small>' + esc(tr.a) + '</small></div>' +
                                      '<span class="row-dur">' + fmt(tr.d) + '</span></div>'
                                    );
                                  }

                                  function rowV(x, n) {
                                    var v = x[0];
                                    return (
                                      '<div class="row" data-a="hjump" data-k="' + x[1] + '" style="--k:' + n + '">' +
                                      '<div class="row-info"><b>' + esc(v.w) + '</b><small>' + esc(v.m || "—") + '</small></div>' +
                                      '<span class="row-dur">' + esc(tracks[v.t].t) + ' · ' + fmt(v.p) + '</span></div>'
                                    );
                                  }

                                  function sec(t, c) {
                                    return '<div class="sh">' + t + ' <small>' + c + '</small></div>';
                                  }

                                  function renderHome(na) {
                                    var B = $("hbody"), h = "", q = hq.trim().toLowerCase();
                                    var all = tracks.map(function (_, k) { return k; });
                                    B.classList.toggle("na", !!na);

                                    if (hm === "m" && !q) {
                                      h =
                                        '<div class="empty vocab-hint">' +
                                        '<div class="vocab-hint-ico">♪</div>' +
                                        "<b>Tìm nhạc</b>" +
                                        "Nhập tên bài hát, nghệ sĩ hoặc pinyin<br>để tìm bài muốn nghe." +
                                        "</div>";
                                    } else if (hm === "m") {
                                      var qn = stripTones(q);
                                      var r = all.filter(function (k) {
                                        var tr = tracks[k];
                                        var hay = stripTones(tr.t + " " + tr.a + " " + (tr.py || ""));
                                        return hay.indexOf(qn) >= 0;
                                      });
                                      h = r.length ? sec("Trong thư viện", r.length) + r.map(rowT).join("") : "";
                                      h += sec("YouTube", ytResults.length);
                                      if (ytSearching) {
                                        h += '<div class="empty">Đang tìm trên YouTube…</div>';
                                      } else if (ytSearchError === "nokey") {
                                        h +=
                                          '<div class="empty" data-a="ytkey" style="cursor:pointer">Chưa có YouTube API Key.<br><b>Bấm để nhập key</b></div>';
                                      } else if (ytSearchError) {
                                        h += '<div class="empty">Không tìm được trên YouTube.<br><small>Kiểm tra mạng hoặc API Key.</small></div>';
                                      } else if (ytResults.length) {
                                        h += ytResults.map(rowY).join("");
                                      } else {
                                        h += '<div class="empty">Không có kết quả trên YouTube</div>';
                                      }
                                    } else if (hm === "w") {
                                      /* Tìm từ vựng trong tất cả bài: Trung / pinyin không thanh → hiện nghĩa + pinyin có thanh */
                                      var qn = stripTones(q);
                                      var found = [];
                                      var seen = {};
                                      tracks.forEach(function (tr, ti) {
                                        (tr.vocab || []).forEach(function (v) {
                                          var key = v.zh + "|" + v.py;
                                          if (seen[key]) return;
                                          var hay = stripTones(v.zh + " " + (v.py || "") + " " + (v.vi || ""));
                                          if (!qn || hay.indexOf(qn) >= 0) {
                                            seen[key] = 1;
                                            found.push({ v: v, song: tr.t, ti: ti });
                                          }
                                        });
                                      });
                                      if (q) {
                                        h =
                                          sec("Kết quả", found.length) +
                                          (found.length
                                            ? '<div class="vlist home-vlist"><div class="vhead"><span>Trung</span><span>Pinyin</span><span>Việt</span></div>' +
                                              found
                                                .slice(0, 80)
                                                .map(function (x, n) {
                                                  return (
                                                    '<div class="vitem" style="--k:' +
                                                    n +
                                                    '"><span class="zh">' +
                                                    esc(x.v.zh) +
                                                    '</span><span class="py">' +
                                                    esc(x.v.py) +
                                                    '</span><span class="vi">' +
                                                    esc(x.v.vi) +
                                                    "</span></div>"
                                                  );
                                                })
                                                .join("") +
                                              "</div>"
                                            : '<div class="empty">Không tìm thấy từ nào<br><small>Thử chữ Hán hoặc pinyin không thanh (vd: dong mian)</small></div>');
                                      } else {
                                        h =
                                          '<div class="empty vocab-hint">' +
                                          '<div class="vocab-hint-ico">字</div>' +
                                          "<b>Tra từ vựng</b><br>" +
                                          "Nhập chữ Hán hoặc pinyin <em>không thanh</em><br>" +
                                          "để xem nghĩa và cách phát âm có thanh." +
                                          "</div>";
                                      }
                                    } else {
                                      h =
                                        sec("Playlist của tôi", S.p.length) +
                                        '<div class="cards">' +
                                        S.p
                                          .map(function (p, k) {
                                            var t = tracks[p.s[0]];
                                            var g = t ? "linear-gradient(150deg," + t.c[0] + "," + t.w + ")" : "linear-gradient(150deg,#c7c7cc,#8e8e93)";
                                            var bg = t && t.img ? "url('" + esc(t.img).replace(/'/g, "%27") + "') center/cover no-repeat, " + g : g;
                                            return (
                                              '<div class="pc-wrap">' +
                                              '<button class="pc" data-a="hpl" data-k="p' +
                                              k +
                                              '" style="background:' + bg + '"><b>' +
                                              esc(p.n) +
                                              "</b><small>" +
                                              p.s.length +
                                              " bài</small></button>" +
                                              '<button class="pc-del" data-a="hdelpl" data-k="' +
                                              k +
                                              '" aria-label="Xoá playlist" title="Xoá">×</button>' +
                                              "</div>"
                                            );
                                          })
                                          .join("") +
                                        '<button class="pc new" data-a="hnew"><b>＋</b><small>Playlist mới</small></button></div>';

                                      if (creating) {
                                        h +=
                                          '<div class="add"><input id="hpn" maxlength="30" placeholder="Tên playlist mới"><button data-a="hcreate">Tạo</button></div>';
                                      }

                                      if (!S.p.length && !creating) {
                                        h +=
                                          '<div class="empty" style="padding-top:8px">Chưa có playlist.<br>Bấm ＋ để tạo playlist mới.</div>';
                                      }

                                      h +=
                                        sec("Yêu thích", S.f.length) +
                                        (S.f.length
                                          ? S.f.map(rowT).join("")
                                          : '<div class="empty">Bấm ♥ ở trình phát để lưu bài yêu thích</div>');

                                    }
                                    B.innerHTML = h;
                                  }

                                  $("hbody").onclick = function (e) {
                                    var b = e.target.closest("[data-a]");
                                    if (!b) return;
                                    var a = b.dataset.a, k = b.dataset.k;
                                    if (a === "hplay") playTrack(+k);
                                    else if (a === "hpl") open("q", k);
                                    else if (a === "hnew") {
                                      creating = !creating;
                                      renderHome(1);
                                      if (creating) $("hpn") && $("hpn").focus();
                                    } else if (a === "hcreate") homeCreate();
                                    else if (a === "hdelpl") {
                                      var idx = +k;
                                      if (idx < 0 || idx >= S.p.length) return;
                                      var name = S.p[idx].n;
                                      if (!confirm('Xoá playlist “' + name + '”?')) return;
                                      S.p.splice(idx, 1);
                                      save();
                                      toast("Đã xoá playlist “" + name + "”");
                                    } else if (a === "hjump") jumpV(+k);
                                    else if (a === "hsave") homeSaveWord();
                                    else if (a === "ytplay") playYT(k);
                                    else if (a === "ytkey") askYtKey();
                                  };

                                  $("hbody").addEventListener("keydown", function (e) {
                                    if (e.key !== "Enter") return;
                                    if (e.target.id === "hpn") homeCreate();
                                    else if (e.target.id === "hmean") homeSaveWord();
                                  });

                                  function homeCreate() {
                                    var v = $("hpn").value.trim();
                                    if (!v) return;
                                    S.p.push({ n: v, s: [] });
                                    creating = false;
                                    save();
                                    toast("Đã tạo playlist “" + v + "”");
                                  }

                                  function homeSaveWord() {
                                    var w = hq.trim();
                                    if (!w) return;
                                    S.v.unshift({ w: w, m: $("hmean").value.trim(), t: i, p: pos });
                                    save();
                                    syncBadge();
                                    toast("Đã lưu từ vựng");
                                  }

                                  $("q").oninput = function () {
                                    hq = this.value;
                                    $("qc").hidden = !hq;
                                    renderHome(1);
                                    if (hm === "m") queueYtSearch(hq.trim());
                                  };
                                  $("qc").onclick = function () {
                                    hq = "";
                                    $("q").value = "";
                                    this.hidden = true;
                                    if (hm === "m") queueYtSearch("");
                                    renderHome();
                                    $("q").focus();
                                  };

                                  document.querySelectorAll(".tab").forEach(function (b) {
                                    b.onclick = function () {
                                      hm = b.dataset.m;
                                      hq = "";
                                      creating = false;
                                      $("q").value = "";
                                      $("qc").hidden = true;
                                      $("sbox").hidden = hm === "me";
                                      $("tabs").setAttribute("data-p", b.dataset.p);
                                      document.querySelectorAll(".tab").forEach(function (x) {
                                        x.classList.toggle("on", x === b);
                                      });
                                      $("q").placeholder =
                                        hm === "w" ? "Chữ Hán hoặc pinyin không thanh..." : "Tìm bài hát, nghệ sĩ, pinyin...";
                                      queueYtSearch("");
                                      renderHome();
                                      $("hbody").scrollTop = 0;
                                    };
                                  });

                                  $("mini").onclick = openPlayer;
                                  $("mPlay").onclick = function (e) {
                                    e.stopPropagation();
                                    setPlaying(!playing);
                                  };
                                  $("min").onclick = closePlayer;

                                  // ========== SHEET ==========
                                  function open(m, arg) {
                                    mode = m;
                                    if (m === "q") tab = arg || "all";
                                    if (m === "v") {
                                      vp = pos;
                                      vi = i;
                                      vt = "cur";
                                    }
                                    render();
                                    $("sheet").classList.add("open");
                                  }
                                  function close() {
                                    $("sheet").classList.remove("open");
                                    mode = "";
                                  }

                                  function render(na) {
                                    var P = $("pane"),
                                      h = '<div class="grab"></div>',
                                      tr = tracks[i];
                                    P.classList.toggle("na", !!na);
                                    P.classList.toggle("tall", mode === "ly" || mode === "v" || mode === "q");

                                    if (mode === "q") {
                                      var ch = [
                                        ["all", "Tất cả"],
                                        ["fav", "Yêu thích"]
                                      ].concat(
                                        S.p.map(function (p, k) {
                                          return ["p" + k, p.n];
                                        })
                                      );
                                      var ids =
                                        tab === "all"
                                          ? tracks.map(function (_, k) { return k; })
                                          : tab === "fav"
                                          ? S.f
                                          : (S.p[+tab.slice(1)] || { s: [] }).s;
                                      h +=
                                        '<div class="hd">Danh sách phát</div><div class="chips">' +
                                        ch
                                          .map(function (c) {
                                            return (
                                              '<button class="chip' +
                                              (c[0] === tab ? " on" : "") +
                                              '" data-a="tab" data-k="' +
                                              c[0] +
                                              '">' +
                                              esc(c[1]) +
                                              "</button>"
                                            );
                                          })
                                          .join("") +
                                        '</div><div class="body">' +
                                        (ids.length
                                          ? ids
                                              .map(function (k, n) {
                                                var coverHtml = tracks[k].img
                                                  ? '<img class="row-cover" src="' + esc(tracks[k].img) + '" alt="" />'
                                                  : '<div class="row-cover" style="background:linear-gradient(135deg,' +
                                                    tracks[k].c[0] +
                                                    "," +
                                                    tracks[k].w +
                                                    ')"></div>';
                                                return (
                                                  '<div class="row' +
                                                  (k === i ? " cur" : "") +
                                                  '" data-a="play" data-k="' +
                                                  k +
                                                  '" style="--k:' +
                                                  n +
                                                  '">' +
                                                  coverHtml +
                                                  '<div class="row-info"><b>' +
                                                  esc(tracks[k].t) + "</b><small>" + esc(tracks[k].a) +
                                                  "</small></div>" +
                                                  '<span class="row-dur">' +
                                                  fmt(tracks[k].d) +
                                                  "</span></div>"
                                                );
                                              })
                                              .join("")
                                          : '<div class="empty">Chưa có bài nào</div>') +
                                        "</div>";
                                    } else if (mode === "a") {
                                      var rows = [
                                        ["f", "Yêu thích", S.f.length, S.f.indexOf(i) >= 0]
                                      ].concat(
                                        S.p.map(function (p, k) {
                                          return [k, p.n, p.s.length, p.s.indexOf(i) >= 0];
                                        })
                                      );
                                      h +=
                                        '<div class="hd">Thêm vào playlist <small>' +
                                        esc(tr.t) +
                                        '</small></div><div class="body">' +
                                        rows
                                          .map(function (x, n) {
                                            return (
                                              '<div class="row" data-a="tog" data-k="' +
                                              x[0] +
                                              '" style="--k:' +
                                              n +
                                              '"><div class="row-info"><b>' +
                                              esc(x[1]) +
                                              "</b><small>" +
                                              x[2] +
                                              ' bài</small></div><span class="ck' +
                                              (x[3] ? " on" : "") +
                                              '">' +
                                              (x[3] ? "✓" : "") +
                                              "</span></div>"
                                            );
                                          })
                                          .join("") +
                                        '<div class="add"><input id="npl" maxlength="30" placeholder="Tên playlist mới"><button data-a="newpl">Tạo</button></div></div>';
                                    } else if (mode === "v") {
                                      var list = tr.vocab || [];
                                      h +=
                                        '<div class="hd">Từ vựng bài này <small>' +
                                        esc(tr.t) +
                                        " · " +
                                        list.length +
                                        " từ</small></div>" +
                                        '<div class="body">' +
                                        (list.length
                                          ? '<div class="vlist"><div class="vhead"><span>Trung</span><span>Pinyin</span><span>Việt</span></div>' +
                                            list
                                              .map(function (v, n) {
                                                return (
                                                  '<div class="vitem" style="--k:' +
                                                  n +
                                                  '"><span class="zh">' +
                                                  esc(v.zh) +
                                                  '</span><span class="py">' +
                                                  esc(v.py) +
                                                  '</span><span class="vi">' +
                                                  esc(v.vi) +
                                                  "</span></div>"
                                                );
                                              })
                                              .join("") +
                                            "</div>"
                                          : '<div class="empty">Bài này chưa có từ vựng</div>') +
                                        "</div>";
                                    } else if (mode === "ly") {
                                      var lyList = tr.l || [];
                                      var lyHtml = lyList
                                        .map(function (sec) {
                                          var singer = sec.s
                                            ? '<span class="singer">' + esc(sec.s) + "</span>\n"
                                            : "";
                                          return singer + sec.lines.map(esc).join("\n");
                                        })
                                        .join("\n\n");
                                      h +=
                                        '<div class="hd"><span>Lời bài hát <small>' +
                                        esc(tr.t) +
                                        "</small></span>" +
                                        (lyList.length ? '<button class="chip" data-a="copy">Sao chép</button>' : "") +
                                        "</div>" +
                                        '<div class="body">' +
                                        (lyList.length
                                          ? '<div class="lytxt" id="lyt">' + lyHtml + "</div>"
                                          : '<div class="empty">Bài này chưa có lời bài hát</div>') +
                                        "</div>";
                                    } else return;
                                    var oc = mode === "q" && $("sheet").classList.contains("open") ? P.querySelector(".chips") : null;
                                    var sl = oc ? oc.scrollLeft : 0;
                                    P.innerHTML = h;
                                    if (oc) { var nc = P.querySelector(".chips"); if (nc) nc.scrollLeft = sl; }
                                  }

                                  function copyLy() {
                                    var tr = tracks[i];
                                    var txt = tr.l
                                      .map(function (sec) {
                                        return (sec.s ? sec.s + "\n" : "") + sec.lines.join("\n");
                                      })
                                      .join("\n\n");
                                    function fb() {
                                      var r = document.createRange();
                                      r.selectNodeContents($("lyt"));
                                      var s = getSelection();
                                      s.removeAllRanges();
                                      s.addRange(r);
                                      try { document.execCommand("copy"); } catch (e) {}
                                      toast("Đã sao chép lời");
                                    }
                                    if (navigator.clipboard && navigator.clipboard.writeText) {
                                      navigator.clipboard.writeText(txt).then(function () {
                                        toast("Đã sao chép lời");
                                      }, fb);
                                    } else fb();
                                  }

                                  function togList(k) {
                                    if (k === "f") {
                                      togFav();
                                      render(1);
                                      return;
                                    }
                                    var a = S.p[+k].s,
                                      j = a.indexOf(i);
                                    if (j < 0) {
                                      a.push(i);
                                      toast("Đã thêm vào “" + S.p[+k].n + "”");
                                    } else {
                                      a.splice(j, 1);
                                      toast("Đã bỏ khỏi “" + S.p[+k].n + "”");
                                    }
                                    save();
                                    render(1);
                                  }

                                  function togFav() {
                                    var j = S.f.indexOf(i);
                                    if (j < 0) {
                                      S.f.push(i);
                                      toast("Đã thêm vào Yêu thích");
                                    } else {
                                      S.f.splice(j, 1);
                                      toast("Đã bỏ khỏi Yêu thích");
                                    }
                                    save();
                                    syncLike();
                                  }

                                  function addVocab() {
                                    var w = $("vw").value.trim(),
                                      m = $("vm").value.trim();
                                    if (!w) {
                                      $("vw").focus();
                                      return;
                                    }
                                    S.v.unshift({ w: w, m: m, t: vi, p: vp });
                                    save();
                                    syncBadge();
                                    toast("Đã lưu từ vựng");
                                    vp = pos;
                                    vi = i;
                                    render(1);
                                    $("vw").focus();
                                  }

                                  function newPl() {
                                    var v = $("npl").value.trim();
                                    if (!v) return;
                                    S.p.push({ n: v, s: [i] });
                                    save();
                                    toast("Đã tạo playlist “" + v + "”");
                                    render(1);
                                  }

                                  $("pane").onclick = function (e) {
                                    var b = e.target.closest("[data-a]");
                                    if (!b) return;
                                    var a = b.dataset.a,
                                      k = b.dataset.k;
                                    if (a === "tab") {
                                      if (tab === k) return;
                                      tab = k;
                                      var body = $("pane").querySelector(".body");
                                      if (body) {
                                        body.classList.add("sw");
                                        setTimeout(function () { render(); }, 160);
                                      } else render();
                                    } else if (a === "play") {
                                      playTrack(+k);
                                      close();
                                    } else if (a === "tog") togList(k);
                                    else if (a === "newpl") newPl();
                                    else if (a === "vt") {
                                      if (vt === k) return;
                                      vt = k;
                                      var body2 = $("pane").querySelector(".body");
                                      if (body2) {
                                        body2.classList.add("sw");
                                        setTimeout(function () { render(); }, 160);
                                      } else render();
                                    } else if (a === "addv") addVocab();
                                    else if (a === "delv") {
                                      S.v.splice(+k, 1);
                                      save();
                                      syncBadge();
                                      render(1);
                                    } else if (a === "jump") jumpV(+k);
                                    else if (a === "copy") copyLy();
                                  };

                                  $("pane").addEventListener("input", function (e) {
                                    if (e.target.id === "vw" && e.target.value.length === 1) {
                                      vp = pos;
                                      vi = i;
                                    }
                                  });
                                  $("pane").addEventListener("keydown", function (e) {
                                    if (e.key !== "Enter") return;
                                    if (e.target.id === "vw") $("vm").focus();
                                    else if (e.target.id === "vm") addVocab();
                                    else if (e.target.id === "npl") newPl();
                                  });
                                  $("sheet").onclick = function (e) {
                                    if (e.target === this) close();
                                  };

                                  // ========== CONTROLS ==========
                                  function seekTo(e) {
                                    var r = $("seek").getBoundingClientRect();
                                    var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
                                    var tr = tracks[i];
                                    var dur = ytMode
                                      ? (ytDuration || tr.d)
                                      : (useAudio && audio.duration && isFinite(audio.duration) ? audio.duration : tr.d);
                                    pos = f * dur;
                                    if (ytMode) { if (ytPlayer && ytReady && ytPlayer.seekTo) ytPlayer.seekTo(pos, true); }
                                    else if (useAudio) setT(pos);
                                    paint();
                                  }
                                  var drag = false;
                                  $("seek").addEventListener("pointerdown", function (e) {
                                    drag = true;
                                    this.setPointerCapture(e.pointerId);
                                    seekTo(e);
                                  });
                                  $("seek").addEventListener("pointermove", function (e) {
                                    if (drag) seekTo(e);
                                  });
                                  $("seek").addEventListener("pointerup", function () {
                                    drag = false;
                                  });

                                  $("play").onclick = function () { setPlaying(!playing); };
                                  $("prev").onclick = function () { step(-1); };
                                  $("next").onclick = function () { step(1); };
                                  $("shuffle").onclick = function () {
                                    shuffle = !shuffle;
                                    this.classList.toggle("on", shuffle);
                                    toast(shuffle ? "Phát ngẫu nhiên: Bật" : "Phát ngẫu nhiên: Tắt");
                                  };
                                  $("like").onclick = togFav;
                                  $("queue").onclick = function () { open("q"); };
                                  $("bV").onclick = function () { open("v"); };
                                  $("bA").onclick = function () { open("a"); };
                                  $("bL").onclick = function () { open("ly"); };

                                  $("share").onclick = function () {
                                    var tr = tracks[i];
                                    var text = tr.t + " – " + tr.a;
                                    if (navigator.share) {
                                      navigator.share({ title: text, text: text }).catch(function () {});
                                    } else {
                                      toast("Đã sao chép: " + text);
                                      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
                                    }
                                  };

                                  // Init
                                  load(0);
                                  pos = 0;
                                  syncBadge();
                                  paint();
                                  setPlaying(false, true);
                                  renderHome();
        </script>
    </body>
</html>
