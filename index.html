<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#f2f2f7" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
        />
        <title>MAppEwi</title>
        <link rel="manifest" href="data:application/manifest+json,{}" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff2d55' width='100' height='100' rx='22'/><path fill='white' d='M35 25v50l35-25z'/></svg>"
        />
        <link
            rel="apple-touch-icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff2d55' width='100' height='100' rx='22'/><path fill='white' d='M35 25v50l35-25z'/></svg>"
        />
        <meta name="apple-mobile-web-app-title" content="MAppEwi" />
        <meta property="og:title" content="MAppEwi" />
        <meta
            property="og:image"
            content="https://i.kfs.io/album/global/277994877,0v2/fit/500x500.jpg"
        />
        <style>
                        /* Cho phép --tint-rgb chuyển màu mượt khi đổi bài */
                        @property --tint-rgb {
                          syntax: "<number>#";
                          inherits: true;
                          initial-value: 232, 228, 239;
                        }
                        @property --bg-top  { syntax: "<number>#"; inherits: true; initial-value: 110, 120, 170; }
                        @property --bg-edge { syntax: "<number>#"; inherits: true; initial-value: 130, 140, 190; }
                        @property --bg-mid  { syntax: "<number>#"; inherits: true; initial-value: 170, 180, 225; }
                        @property --glow1   { syntax: "<number>#"; inherits: true; initial-value: 190, 195, 230; }
                        @property --glow2   { syntax: "<number>#"; inherits: true; initial-value: 200, 190, 230; }

                        :root {
                          --bg: #f2f2f7;
                          --bg2: #e5e5ea;
                          --surface: #ffffff;
                          --surface2: #f5f5f7;
                          --text: #1c1c1e;
                          --sub: #6e6e73;
                          --muted: #8e8e93;
                          --accent: #ff2d55;
                          --accent2: #bf5af2;
                          --green: #30d158;
                          --track: rgba(0,0,0,.12);
                          --glass: rgba(255,255,255,.85);
                          --shadow: 0 12px 40px rgba(0,0,0,.12);
                          color-scheme: light;
                        }

                        *, *::before, *::after { box-sizing: border-box; }
                        html, body { height: 100%; height: 100dvh; margin: 0; }
                        body {
                          background: var(--bg);
                          color: var(--text);
                          font-family: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
                          -webkit-font-smoothing: antialiased;
                          -webkit-tap-highlight-color: transparent;
                          overflow: hidden;
                          user-select: none;
                          transition: background-color .6s ease;
                        }
                        button {
                          background: none; border: 0; color: inherit; padding: 0;
                          cursor: pointer; font: inherit; -webkit-appearance: none;
                        }
                        [hidden] { display: none !important; }
                        svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
                        img { display: block; max-width: 100%; }

                        .app {
                          position: relative;
                          height: 100%;
                          height: 100dvh;
                          max-width: 430px;
                          margin: 0 auto;
                          overflow: hidden;
                          background: var(--bg);
                        }

                        /* ========== HOME ========== */
                        .home {
                          position: absolute; inset: 0;
                          --tabh: calc(56px + env(safe-area-inset-bottom, 0px));
                          padding-top: env(safe-area-inset-top, 0px);
                          display: flex; flex-direction: column;
                          transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .4s;
                        }
                        .app.show .home {
                          transform: scale(.94) translateY(-8px);
                          opacity: .35;
                          pointer-events: none;
                        }

                        .tabbar {
                          position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
                          height: var(--tabh); padding-bottom: env(safe-area-inset-bottom, 0px);
                          background: var(--glass);
                          backdrop-filter: blur(24px) saturate(180%);
                          -webkit-backdrop-filter: blur(24px) saturate(180%);
                          border-top: 1px solid rgba(0,0,0,.05);
                        }
                        .tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); height: 56px; }
                        .tp {
                          position: absolute; left: 0; top: 11px; width: calc(100% / 3); height: 34px;
                          pointer-events: none; transition: transform .4s cubic-bezier(.32,.72,0,1);
                        }
                        .tp::before {
                          content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
                          width: 64px; margin-left: -32px; border-radius: 17px;
                          background: rgba(255,45,85,.12);
                        }
                        .tabs[data-p="1"] .tp { transform: translateX(100%); }
                        .tabs[data-p="2"] .tp { transform: translateX(200%); }
                        .tab {
                          position: relative; display: grid; place-items: center;
                          color: var(--muted); transition: color .25s, transform .18s;
                        }
                        .tab svg { width: 26px; height: 26px; transition: stroke-width .2s; }
                        .tab:active { transform: scale(.88); }
                        .tab.on { color: var(--accent); }
                        .tab.on svg { stroke-width: 2.1; }

                        .fs-home {
                          position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 14px;
                          z-index: 6; width: 40px; height: 40px; display: grid; place-items: center;
                          border-radius: 50%; color: var(--muted); background: var(--surface);
                          box-shadow: 0 2px 10px rgba(0,0,0,.08);
                        }
                        .fs-home:active { transform: scale(.9); background: var(--surface2); }
                        .fs-home svg { width: 20px; height: 20px; stroke-width: 1.7; }
                        .sbox {
                          display: flex; align-items: center; gap: 10px;
                          margin: 14px 20px 8px; padding: 0 14px;
                          height: 44px; border-radius: 12px;
                          background: var(--surface2);
                        }
                        .sbox svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
                        .sbox input {
                          flex: 1; min-width: 0; background: none; border: 0; outline: 0;
                          color: var(--text); font: inherit; font-size: 16px;
                        }
                        .sbox input::placeholder { color: var(--muted); }
                        .sbox button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }

                        .hbody {
                          flex: 1; min-height: 0; overflow-y: auto;
                          padding: 4px 0 calc(150px + env(safe-area-inset-bottom, 0px));
                          -webkit-overflow-scrolling: touch;
                        }
                        .sh {
                          padding: 18px 20px 8px;
                          font-weight: 700; font-size: 18px;
                          display: flex; align-items: baseline; gap: 8px;
                        }
                        .sh small { color: var(--sub); font-weight: 500; font-size: 13px; }

                        .cards {
                          display: flex; gap: 12px; overflow-x: auto;
                          padding: 4px 20px 12px;
                          scrollbar-width: none;
                        }
                        .cards::-webkit-scrollbar { display: none; }

                        .pc {
                          flex: none; width: 140px; height: 140px;
                          border-radius: 14px; padding: 14px;
                          text-align: left; display: flex; flex-direction: column;
                          justify-content: flex-end; gap: 3px;
                          position: relative; overflow: hidden;
                          transition: transform .18s;
                          box-shadow: 0 4px 16px rgba(0,0,0,.12);
                        }
                        .pc::after {
                          content: ""; position: absolute; inset: 0;
                          background: linear-gradient(to top, rgba(0,0,0,.45) 0%, transparent 55%);
                          pointer-events: none;
                        }
                        .pc:active { transform: scale(.96); }
                        .pc b, .pc small { position: relative; z-index: 1; }
                        .pc b { font-size: 15px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                        .pc small { color: rgba(255,255,255,.8); font-size: 12px; }
                        .pc.new {
                          background: var(--surface2) !important;
                          align-items: center; justify-content: center;
                          box-shadow: none; border: 1.5px dashed var(--track);
                        }
                        .pc.new::after { display: none; }
                        .pc.new b { font-size: 28px; font-weight: 300; color: var(--sub); }
                        .pc.new small { color: var(--sub); }

                        .pc-wrap {
                          position: relative; flex: none; width: 140px; height: 140px;
                        }
                        .pc-wrap .pc { width: 100%; height: 100%; }
                        .pc-del {
                          position: absolute; top: 6px; right: 6px; z-index: 3;
                          width: 28px; height: 28px; border-radius: 50%;
                          background: rgba(0,0,0,.45); color: #fff;
                          font-size: 18px; line-height: 1; font-weight: 400;
                          display: grid; place-items: center;
                          backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
                          opacity: .85; transition: opacity .15s, transform .15s, background .15s;
                        }
                        .pc-del:active { opacity: 1; transform: scale(.9); background: #ff2d55; }

                        .vocab-hint {
                          padding: 48px 28px; text-align: center; color: var(--sub);
                          font-size: 14px; line-height: 1.55;
                        }
                        .vocab-hint b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
                        .vocab-hint-ico {
                          width: 56px; height: 56px; margin: 0 auto 14px;
                          border-radius: 16px; background: var(--surface2);
                          display: grid; place-items: center;
                          font-size: 26px; font-weight: 600; color: var(--accent2);
                        }
                        .home-vlist { padding: 4px 20px 24px; }
                        .home-vlist .vhead {
                          position: sticky; top: 0; background: var(--bg); z-index: 1;
                        }

                        .row {
                          display: flex; align-items: center; gap: 14px;
                          padding: 10px 20px; cursor: pointer;
                          transition: background .15s;
                        }
                        .row:active { background: var(--surface2); }
                        .row.cur { background: var(--surface2); }
                        .row-cover {
                          width: 48px; height: 48px; border-radius: 8px; flex: none;
                          box-shadow: 0 2px 8px rgba(0,0,0,.1);
                          object-fit: cover; background: var(--surface2);
                        }
                        .row-info { flex: 1; min-width: 0; }
                        .row-info b {
                          display: block; font-size: 15px; font-weight: 500;
                          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                        }
                        .row-info small { color: var(--sub); font-size: 13px; }
                        .row-dur { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
                        .empty { padding: 32px 24px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.5; }

                        /* Mini player */
                        .mini {
                          position: absolute; left: 0; right: 0; bottom: var(--tabh);
                          height: 64px; display: flex; align-items: center; gap: 12px;
                          padding: 0 12px; border-radius: 16px 16px 0 0;
                          background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
                          -webkit-backdrop-filter: blur(24px) saturate(180%);
                          box-shadow: 0 -4px 24px rgba(0,0,0,.1);
                          cursor: pointer; z-index: 4; overflow: hidden;
                          border: 0; border-top: 1px solid rgba(0,0,0,.06);
                          margin-bottom: -1px;
                        }
                        .mc {
                          width: 48px; height: 48px; border-radius: 10px; flex: none;
                          box-shadow: 0 2px 8px rgba(0,0,0,.12);
                          object-fit: cover; background: var(--surface2);
                        }
                        .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
                        .mt b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                        .mt small { color: var(--sub); font-size: 12px; }
                        .mini-btns { display: flex; align-items: center; gap: 2px; }
                        .mini button {
                          width: 42px; height: 42px; display: grid; place-items: center;
                        }
                        .mini button svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
                        .mp {
                          position: absolute; left: 0; right: 0; top: 0; height: 2.5px;
                          background: var(--track);
                        }
                        .mp i {
                          display: block; height: 100%; background: var(--text); width: 0;
                          border-radius: 0 2px 2px 0;
                          transition: none;
                        }

                        /* ========== NOW PLAYING – light ========== */
                        .np {
                          position: absolute; inset: 0; z-index: 3;
                          display: flex; flex-direction: column; overflow: hidden;
                          --tint-rgb: 232,228,239;
                          background: rgb(var(--tint-rgb));
                          transform: translateY(105%);
                          visibility: hidden;
                          transition: transform .5s cubic-bezier(.32,.72,0,1), visibility 0s .5s, --tint-rgb .9s ease, --bg-top .9s ease, --bg-edge .9s ease, --bg-mid .9s ease, --glow1 .9s ease, --glow2 .9s ease;
                          color: #2c2c2e;
                          touch-action: pan-x;
                        }
                        .app.show .np {
                          transform: none; visibility: visible;
                          transition: transform .5s cubic-bezier(.32,.72,0,1), --tint-rgb .9s ease, --bg-top .9s ease, --bg-edge .9s ease, --bg-mid .9s ease, --glow1 .9s ease, --glow2 .9s ease;
                        }
                        .np.dragging { transition: none !important; }

                        .bg-mesh {
                          position: absolute; inset: 0; z-index: 0;
                          pointer-events: none;
                          background:
                            radial-gradient(90% 30% at 92% 70%, rgba(var(--glow2), .42) 0%, transparent 100%),
                            radial-gradient(95% 32% at 6% 90%, rgba(var(--glow1), .40) 0%, transparent 100%),
                            linear-gradient(180deg,
                              rgb(var(--bg-top)) 0,
                              rgb(var(--bg-edge)) 38%,
                              rgb(var(--bg-mid)) 58%,
                              rgb(var(--tint-rgb)) 76%,
                              rgb(var(--tint-rgb)) 100%);
                        }

                        .bg-spin {
                          position: absolute; z-index: 0; pointer-events: none;
                          left: 50%; top: 50%;
                          width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax;
                          background-size: cover; background-position: center; background-repeat: no-repeat;
                          filter: blur(22px) saturate(1.2);
                          opacity: 0; transition: opacity .8s ease;
                          animation: bgspin 80s linear infinite;
                          will-change: transform;
                        }
                        .app:not(.show) .bg-spin { animation-play-state: paused; }
                        @keyframes bgspin { to { transform: rotate(360deg); } }
                        @media (prefers-reduced-motion: reduce) { .bg-spin { animation: none; } }

                        .cover-bg {
                          --cw: min(100vw, 430px);
                          --sat: env(safe-area-inset-top, 0px);
                          --sab: env(safe-area-inset-bottom, 0px);
                          position: absolute; z-index: 0; overflow: hidden;
                          left: 50%; width: var(--cw); height: var(--cw);
                          margin-left: calc(var(--cw) / -2);
                          top: calc((100% + var(--sat) - var(--sab) - 246px) / 2);
                          margin-top: calc(var(--cw) / -2);
                          -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.6) 6%, #000 18%, #000 55%, rgba(0,0,0,.7) 82%, transparent 100%);
                          mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.6) 6%, #000 18%, #000 55%, rgba(0,0,0,.7) 82%, transparent 100%);
                        }
                        .cover-inner {
                          position: absolute; inset: 0;
                          background-size: cover;
                          background-position: center;
                          background-repeat: no-repeat;
                        }
                        .cover-fallback {
                          position: absolute; inset: 0;
                          background:
                            radial-gradient(ellipse 80% 60% at 50% 28%, var(--c1) 0%, transparent 55%),
                            radial-gradient(circle at 22% 35%, var(--c2) 0 18%, transparent 45%),
                            radial-gradient(circle at 78% 22%, var(--c3) 0 14%, transparent 40%),
                            radial-gradient(circle at 65% 55%, var(--c4) 0 12%, transparent 38%),
                            radial-gradient(ellipse at 50% 85%, var(--wash), transparent 55%),
                            linear-gradient(180deg, #eae6f0 0%, #d9d2e4 40%, #cfc6db 100%);
                        }

                        /* Thanh trên: chỉ còn trạng thái, không còn nút mũi tên */
                        .top {
                          position: absolute; top: 0; left: 0; right: 0;
                          display: flex; align-items: center; justify-content: center;
                          padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0;
                          z-index: 2;
                        }
                        .grabber {
                          position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); left: 50%;
                          width: 40px; height: 5px; margin-left: -20px; border-radius: 3px;
                          background: rgba(40,40,50,.35); z-index: 3;
                        }
                        .top .status {
                          display: flex; align-items: center; gap: 5px;
                          font-size: 12px; font-weight: 500;
                          padding: 5px 10px; border-radius: 16px;
                          background: rgba(255,255,255,.55);
                          color: rgba(40,40,50,.7);
                          backdrop-filter: blur(8px);
                          -webkit-backdrop-filter: blur(8px);
                          margin-top: 10px;
                        }
                        .status.fd { opacity: 0; transition: opacity .2s; }
                        .status i {
                          width: 6px; height: 6px; border-radius: 50%;
                          background: #30d158;
                          box-shadow: 0 0 0 2.5px rgba(48,209,88,.25);
                        }
                        .status.off i { background: rgba(0,0,0,.25); box-shadow: none; }
                        .top .status { transition: color .5s, background-color .5s; }
                        .np[data-top="dark"] .top .status { background: rgba(255,255,255,.2); color: rgba(255,255,255,.92); }
                        .np[data-top="dark"] .status.off i { background: rgba(255,255,255,.55); }

                        .np-bottom {
                          position: relative;
                          z-index: 1;
                          margin-top: auto;
                          padding: 28px 0 calc(14px + env(safe-area-inset-bottom, 0px));
                          background: linear-gradient(
                            to top,
                            rgba(var(--tint-rgb), .68) 0%,
                            rgba(var(--tint-rgb), .45) 40%,
                            rgba(var(--tint-rgb), .15) 78%,
                            transparent 100%
                          );
                          color: #fff;
                        }

                        .info {
                          padding: 0 24px 6px;
                          text-align: left;
                        }
                        .info h1 {
                          margin: 0;
                          font-size: 22px;
                          font-weight: 700;
                          letter-spacing: -.2px;
                          color: #1c1c1e;
                          overflow: hidden; white-space: nowrap;
                        }
                        .info h1 .marquee-wrap {
                          display: inline-block; white-space: nowrap;
                        }
                        .info h1.marquee .marquee-wrap {
                          animation: marquee 12s linear infinite;
                          padding-right: 40px;
                        }
                        @keyframes marquee {
                          0% { transform: translateX(0); opacity: 1; }
                          5% { opacity: 1; }
                          45% { transform: translateX(calc(-100% + min(100%, 280px))); opacity: 1; }
                          50% { transform: translateX(calc(-100% + min(100%, 280px))); opacity: 0; }
                          51% { transform: translateX(0); opacity: 0; }
                          56% { opacity: 1; }
                          100% { transform: translateX(0); opacity: 1; }
                        }
                        .mt b { overflow: hidden; white-space: nowrap; }
                        .mt b .marquee-wrap { display: inline-block; white-space: nowrap; }
                        .mt b.marquee .marquee-wrap {
                          animation: marqueeMini 9s linear infinite;
                          padding-right: 30px;
                        }
                        @keyframes marqueeMini {
                          0% { transform: translateX(0); opacity: 1; }
                          5% { opacity: 1; }
                          45% { transform: translateX(calc(-100% + 120px)); opacity: 1; }
                          50% { transform: translateX(calc(-100% + 120px)); opacity: 0; }
                          51% { transform: translateX(0); opacity: 0; }
                          56% { opacity: 1; }
                          100% { transform: translateX(0); opacity: 1; }
                        }
                        .artist-row {
                          display: flex;
                          align-items: center;
                          flex-wrap: wrap;
                          gap: 6px;
                          margin-top: 6px;
                        }
                        .artist {
                          font-size: 14px;
                          font-weight: 500;
                          color: #48484e;
                          background: none; border: 0; padding: 0; cursor: pointer;
                          text-align: left;
                        }
                        .artist:active { opacity: .7; }
                        .np .artist { color: rgba(255,255,255,.75); }

                        /* Icon action row */
                        .icon-row {
                          display: flex;
                          justify-content: space-around;
                          align-items: center;
                          padding: 10px 12px 4px;
                          flex-wrap: wrap;
                          gap: 2px;
                        }
                        .icon-row button {
                          display: flex;
                          align-items: center;
                          justify-content: center;
                          width: 48px;
                          height: 48px;
                          border-radius: 14px;
                          color: #48484e;
                          position: relative;
                          transition: background .15s, color .15s, transform .15s;
                        }
                        .icon-row button:active { background: rgba(0,0,0,.06); transform: scale(.92); }
                        .icon-row svg {
                          width: 24px;
                          height: 24px;
                          stroke-width: 1.7;
                        }
                        .icon-row button.on { color: #ff2d55; }
                        .icon-row .liked svg {
                          stroke: #ff2d55;
                          fill: #ff2d55;
                        }

                        /* Progress */
                        .bar {
                          padding: 10px 24px 0;
                        }
                        .seek {
                          position: relative;
                          height: 28px;
                          display: flex;
                          align-items: center;
                          touch-action: none;
                          cursor: pointer;
                        }
                        .seek::before {
                          content: "";
                          position: absolute;
                          left: 0; right: 0;
                          height: 4px;
                          border-radius: 2px;
                          background: rgba(0,0,0,.1);
                        }
                        .fill {
                          position: absolute;
                          left: 0;
                          height: 4px;
                          border-radius: 2px;
                          background: #3a3a3c;
                          width: 0;
                          pointer-events: none;
                          will-change: width;
                        }
                        .knob {
                          position: absolute;
                          width: 14px;
                          height: 14px;
                          margin-left: -7px;
                          border-radius: 50%;
                          background: #3a3a3c;
                          box-shadow: 0 1px 4px rgba(0,0,0,.25);
                          left: 0;
                          pointer-events: none;
                          will-change: left;
                          transition: transform .15s;
                        }
                        .seek:active .knob { transform: scale(1.4); }
                        .times {
                          display: flex;
                          justify-content: space-between;
                          font-size: 11px;
                          margin-top: 2px;
                          font-variant-numeric: tabular-nums;
                          font-weight: 500;
                          color: #5b5b62;
                        }

                        /* Main controls: 5 cột đều nhau, nút play nằm đúng giữa */

                          height: 56px;

                        /* Từ tên bài trở xuống: chữ & icon sáng */
                        .np .info h1 { color: #fff; font-size: 24px; text-shadow: 0 1px 10px rgba(0,0,0,.3); }
                        .np .artist { color: rgba(255,255,255,.75); text-shadow: 0 1px 8px rgba(0,0,0,.3); }
                        .np .icon-row button { color: rgba(255,255,255,.78); }
                        .np .icon-row button:active, .np .ctrl button:active { background: rgba(255,255,255,.12); }
                        .np .icon-row button.on { color: #ff2d55; }
                        .np .times { color: rgba(255,255,255,.5); }
                        .np .seek::before { background: rgba(255,255,255,.22); }
                        .np .fill, .np .knob { background: #fff; }
                        .np .knob { box-shadow: 0 1px 4px rgba(0,0,0,.35); }
                        .np .ctrl button { color: rgba(255,255,255,.88); }
                        .np .ctrl #loopBtn.on { color: #ff2d55; }
                        .np .ctrl #play { color: #fff; background: none; }
                        .np .ctrl #play:active { background: none; transform: scale(.9); }

                        /* Animations */
                        .nx { animation: inR .4s cubic-bezier(.32,.72,0,1); }
                        .pv { animation: inL .4s cubic-bezier(.32,.72,0,1); }
                        .cv { animation: cv .55s cubic-bezier(.32,.72,0,1); }
                        .icn { animation: icn .22s ease; }
                        @keyframes inR { from { opacity: 0; transform: translateX(24px); } }
                        @keyframes inL { from { opacity: 0; transform: translateX(-24px); } }
                        @keyframes cv { from { opacity: 0; transform: scale(1.06); } }
                        @keyframes icn { from { opacity: 0; transform: scale(.55); } }

                        /* ========== SHEET ========== */
                        .sheet {
                          position: absolute; inset: 0;
                          display: flex; align-items: flex-end;
                          background: rgba(0,0,0,0); z-index: 5;
                          visibility: hidden;
                          transition: background .3s, visibility 0s .35s;
                        }
                        .sheet.open {
                          background: rgba(0,0,0,.08); visibility: visible;
                          transition: background .3s;
                        }
                        .pane {
                          width: 100%; max-height: 78%;
                          display: flex; flex-direction: column;
                          background: rgba(255,255,255,.62);
                          backdrop-filter: blur(10px) saturate(160%);
                          -webkit-backdrop-filter: blur(10px) saturate(160%);
                          border-radius: 20px 20px 0 0;
                          transform: translateY(100%);
                          transition: transform .4s cubic-bezier(.32,.72,0,1);
                          padding-bottom: env(safe-area-inset-bottom, 0px);
                          box-shadow: 0 -8px 40px rgba(0,0,0,.15);
                        }
                        .pane.tall { height: 78%; }
                        .pane .chip { background: rgba(0,0,0,.06); }
                        .pane .chip.on { background: var(--text); }
                        .pane .add input { background: rgba(0,0,0,.06); }
                        .pane .row.cur, .pane .row:active { background: rgba(0,0,0,.06); }
                        .pane .vhead { background: rgba(255,255,255,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
                        .sheet.open .pane { transform: none; }
                        .grab {
                          width: 36px; height: 4px; border-radius: 2px;
                          background: var(--track); margin: 10px auto 4px; flex: none;
                        }
                        .hd {
                          display: flex; justify-content: space-between; align-items: baseline;
                          gap: 10px; padding: 8px 20px 6px;
                          font-weight: 700; font-size: 17px; flex: none;
                        }
                        .hd small { font-weight: 500; color: var(--sub); font-size: 13px; }
                        .chips {
                          display: flex; gap: 8px; overflow-x: auto;
                          padding: 4px 20px 10px; flex: none; scrollbar-width: none;
                        }
                        .chips::-webkit-scrollbar { display: none; }
                        .chip {
                          flex: none; padding: 7px 14px; border-radius: 20px;
                          background: var(--surface2); font-size: 13px; font-weight: 500;
                          transition: background .25s cubic-bezier(.32,.72,0,1), color .25s, transform .2s;
                        }
                        .chip:active { transform: scale(.94); }
                        .chip.on { background: var(--text); color: var(--bg); }
                        .body {
                          flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px;
                          -webkit-overflow-scrolling: touch;
                          transition: opacity .2s ease, transform .25s cubic-bezier(.32,.72,0,1);
                        }
                        .body.sw { opacity: 0; transform: translateY(8px); }
                        .sheet .row {
                          opacity: 0; transform: translateY(10px);
                          animation: rise .35s forwards;
                          animation-delay: calc(var(--k, 0) * 35ms + 80ms);
                        }
                        .na .row { animation: none; opacity: 1; transform: none; }
                        @keyframes rise { to { opacity: 1; transform: none; } }

                        .tm { display: flex; align-items: center; gap: 8px; flex: none; }
                        .tm button { width: 28px; height: 28px; color: var(--muted); display: grid; place-items: center; }
                        .ck {
                          width: 22px; height: 22px; border-radius: 50%;
                          border: 1.5px solid var(--muted); display: grid; place-items: center;
                          font-size: 12px; color: #fff; flex: none;

                        }
                        .ck.on { background: var(--accent); border-color: var(--accent); }
                        .add {
                          display: flex; gap: 8px; padding: 8px 20px;
                        }
                        .add input {
                          flex: 1; min-width: 0; background: var(--surface2); border: 0;
                          border-radius: 12px; padding: 12px 14px; color: var(--text);

                        .add button {

                        .vlist { padding: 4px 20px 24px; }
                        .vhead {
                          display: grid;

                          gap: 8px;
                          padding: 6px 4px 10px;
                          font-size: 11px;

                          transform: translate(-50%, 12px);
                          background: var(--text); color: var(--bg);

                        .toast.on { opacity: 1; transform: translate(-50%, 0); }

                        audio { display: none; }

                        @media (max-height: 700px) {

                        }
                        /* Chỉnh kích thước riêng cho nút lặp lại (và nút trộn bài nếu muốn) nhỏ gọn hơn */
            .ctrl #loopBtn, .ctrl #shuffle {

    </head>

        <script>
            // ========== DATA ==========
            var tracks = [];

            var S = { f: [], p: [], plays: {} };
            try {
              var raw = localStorage.getItem("player.v2");
              if (raw) {
                var parsed = JSON.parse(raw);
                S.f = parsed.f || [];
                S.p = parsed.p || [];
                S.plays = parsed.plays || {};
              }
            } catch (e) {}
            function save() {
              try { localStorage.setItem("player.v2", JSON.stringify(S)); } catch (e) {}
              renderHome(1);
            }

            // ========== STATE ==========
            var i = 0, pos = 0, playing = false, shuffle = false, repeat = 0, sleepTimer = null, sleepMins = 0, timer = null, raf = null;
            var mode = "", tab = "all", tt = null;
            var hm = "m", hq = "", creating = false;
            var useAudio = false;
            var srcTry = [], srcIdx = 0;

            // ===== GitHub: tự động lấy file mp3 từ repo =====
            var GH_REPO = "kaijules/mp3cnmusic";
            var GH_BRANCH = "main";
            var ghLoaded = false;
            var ghLoading = false;

            function srcList(tr) {
              var s = tr.src;
              if (!s) return [];
              if (!Array.isArray(s)) s = [s];
              return s.filter(function (u) { return u && String(u).trim(); });
            }
            function setT(t) {
              try { audio.currentTime = t; } catch (e) {}
            }
            function loadSrc(k) {
              srcIdx = k;
              audio.preload = "auto";
              audio.src = srcTry[k];
              audio.load();
            }

            // ===== Đọc metadata ID3 từ file mp3 =====
            function synchsafe(b, o) {
              return ((b[o] & 0x7f) << 21) | ((b[o + 1] & 0x7f) << 14) | ((b[o + 2] & 0x7f) << 7) | (b[o + 3] & 0x7f);
            }
            function readText(bytes, enc) {
              if (enc === 0) {
                var s = "";
                for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
                return s.replace(/\0+$/, "").trim();
              }
              if (enc === 3) {
                try {
                  return new TextDecoder("utf-8").decode(bytes).replace(/\0+$/, "").trim();
                } catch (e) {
                  return "";
                }
              }
              try {
                var le = true;
                var start = 0;
                if (bytes.length >= 2) {
                  if (bytes[0] === 0xff && bytes[1] === 0xfe) { le = true; start = 2; }
                  else if (bytes[0] === 0xfe && bytes[1] === 0xff) { le = false; start = 2; }
                }
                var codes = [];
                for (var j = start; j + 1 < bytes.length; j += 2) {
                  var c = le ? (bytes[j] | (bytes[j + 1] << 8)) : ((bytes[j] << 8) | bytes[j + 1]);
                  if (c === 0) break;
                  codes.push(c);
                }
                return String.fromCharCode.apply(null, codes).trim();
              } catch (e2) {
                return "";
              }
            }
            function parseID3(buf) {
              var out = { title: "", artist: "", picture: null, mime: "image/jpeg" };
              var u8 = new Uint8Array(buf);
              if (u8.length < 10 || u8[0] !== 0x49 || u8[1] !== 0x44 || u8[2] !== 0x33) return out;
              var ver = u8[3];
              var tagSize = synchsafe(u8, 6);
              var pos = 10;
              if (u8[5] & 0x40) {
                if (ver >= 4) pos += synchsafe(u8, 10) + 4;
                else pos += ((u8[10] << 24) | (u8[11] << 16) | (u8[12] << 8) | u8[13]) + 4;
              }
              var end = Math.min(10 + tagSize, u8.length);
              while (pos + 10 <= end) {
                var id = String.fromCharCode(u8[pos], u8[pos + 1], u8[pos + 2], u8[pos + 3]);
                if (id.charCodeAt(0) === 0) break;
                var size;
                if (ver >= 4) size = synchsafe(u8, pos + 4);
                else size = (u8[pos + 4] << 24) | (u8[pos + 5] << 16) | (u8[pos + 6] << 8) | u8[pos + 7];
                if (size <= 0 || pos + 10 + size > end) break;
                var data = u8.subarray(pos + 10, pos + 10 + size);
                if (id === "TIT2" || id === "TT2") {
                  var t = readText(data.subarray(1), data[0]);
                  if (t) out.title = t;
                } else if (id === "TPE1" || id === "TP1") {
                  var a = readText(data.subarray(1), data[0]);
                  if (a) out.artist = a;
                } else if ((id === "APIC" || id === "PIC") && !out.picture) {
                  try {
                    var enc = data[0];
                    var k = 1;
                    var mimeEnd = k;
                    while (mimeEnd < data.length && data[mimeEnd] !== 0) mimeEnd++;
                    var mime = "";
                    for (var m = k; m < mimeEnd; m++) mime += String.fromCharCode(data[m]);
                    k = mimeEnd + 1;
                    if (id === "PIC") {
                      mime = mime.toLowerCase() === "jpg" ? "image/jpeg" : "image/" + mime.toLowerCase();
                    } else {
                      if (!mime) mime = "image/jpeg";
                      k++;
                    }
                    if (enc === 0 || enc === 3) {
                      while (k < data.length && data[k] !== 0) k++;
                      k++;
                    } else {
                      while (k + 1 < data.length && !(data[k] === 0 && data[k + 1] === 0)) k += 2;
                      k += 2;
                    }
                    if (k < data.length) {
                      out.picture = data.subarray(k).slice();
                      out.mime = mime || "image/jpeg";
                    }
                  } catch (e3) {}
                }
                pos += 10 + size;
              }
              return out;
            }

            function enhanceTrackFromMp3(tr, url) {
              var headers = { Range: "bytes=0-524287" };
              fetch(url, { headers: headers })
                .then(function (r) {
                  if (r.status === 416 || r.status === 200 || r.status === 206) return r.arrayBuffer();
                  return fetch(url).then(function (r2) { return r2.arrayBuffer(); });
                })
                .then(function (buf) {
                  var meta = parseID3(buf);
                  var changed = false;
                  if (meta.title) { tr.t = meta.title; changed = true; }
                  if (meta.artist) { tr.a = meta.artist; changed = true; }
                  if (meta.picture && meta.picture.length > 100) {
                    try {

            function rgbToHsl(r, g, b) {
              r /= 255; g /= 255; b /= 255;
              var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
              var l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;

                if (h < 0) h += 360;

            function hslToRgb(h, s, l) {
              var C = (1 - Math.abs(2 * l - 1)) * s;

              if (h < 60) { r = C; g = X; b = 0; }
              else if (h < 120) { r = X; g = C; b = 0; }
              else if (h < 180) { r = 0; g = C; b = X; }
              else if (h < 240) { r = 0; g = X; b = C; }
              else if (h < 300) { r = X; g = 0; b = C; }
              else { r = C; g = 0; b = X; }
              return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
            }
            function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
            function hueDiff(a, b) { return ((b - a + 540) % 360) - 180; }

            }
            function parseRgb(str) {
              var m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(str || "");

            }

            function paletteFromPixels(d, N) {
              var BINS = 24, bins = [], k, row, col, p;
              for (k = 0; k < BINS; k++) bins.push({ w: 0, r: 0, g: 0, b: 0 });
              var T = [0, 0, 0, 0], E = [0, 0, 0, 0], A = [0, 0, 0, 0];
              for (row = 0; row < N; row++) {
                for (col = 0; col < N; col++) {
                  p = (row * N + col) * 4;
                  if (d[p + 3] < 128) continue;
                  var r = d[p], g = d[p + 1], b = d[p + 2];
                  var hsl = rgbToHsl(r, g, b);
                  A[0] += r; A[1] += g; A[2] += b; A[3]++;
                  if (row < N * .3) { T[0] += r; T[1] += g; T[2] += b; T[3]++; }
                  else if (row >= N * .6) { E[0] += r; E[1] += g; E[2] += b; E[3]++; }
                  var w = hsl[1] * (1 - Math.abs(2 * hsl[2] - 1));
                  w *= w;
                  if (w < .0005) continue;
                  var bk = bins[Math.floor(hsl[0] / 360 * BINS) % BINS];
                  bk.w += w; bk.r += r * w; bk.g += g * w; bk.b += b * w;
                }
              }
              if (!A[3]) throw new Error("empty");
              function avg(S) {
                var q = S[3] ? S : A, n = q[3];
                return rgbToHsl(q[0] / n, q[1] / n, q[2] / n);
              }
              function win(k) {
                var W = 0, t;
                for (t = -1; t <= 1; t++) W += bins[(k + t + BINS) % BINS].w;
                return W;
              }
              function winHsl(k) {
                var W = 0, R = 0, G = 0, B = 0, t, q;
                for (t = -1; t <= 1; t++) {
                  q = bins[(k + t + BINS) % BINS];
                  W += q.w; R += q.r; G += q.g; B += q.b;
                }
                return rgbToHsl(R / W, G / W, B / W);
              }
              var best = -1, bw = 0, W;
              for (k = 0; k < BINS; k++) {

            function buildTheme(p) {

              var el = clamp(e[2] * .85, .1, .5);

              var eh = (gray || e[1] < .12) ? h1 : h1 + clamp(hueDiff(h1, e[0]), -45, 45);

                mid: toRgb(bh, bs, ml),
                light: toRgb(bh, bs, bl),
                g1: toRgb(bh, bs, bl + .08),
                g2: toRgb(bh, bs, bl + .06),

            // ========== HOME ==========
            function rowT(k, n) {
              var tr = tracks[k];
              var coverHtml = tr.img
                ? '<img class="row-cover" src="' + esc(tr.img) + '" alt="" />'
                : '<div class="row-cover" style="background:linear-gradient(135deg,' + tr.c[0] + ',' + tr.w + ')"></div>';
              return (
                '<div class="row' + (k === i ? " cur" : "") + '" data-a="hplay" data-k="' + k + '" style="--k:' + n + '">' +
                coverHtml +
                '<div class="row-info"><b>' + esc(tr.t) + '</b><small>' + esc(tr.a) + '</small></div>' +
                '<span class="row-dur">' + fmt(tr.d) + '</span></div>'
              );
            }

            function sec(t, c) {
              return '<div class="sh">' + t + ' <small>' + c + '</small></div>';
            }

            function renderHome(na) {
              var B = $("hbody"), h = "", q = hq.trim().toLowerCase();
              var all = tracks.map(function (_, k) { return k; });
              B.classList.toggle("na", !!na);

              if (hm === "m" && !q) {
                h =
                  '<div class="empty vocab-hint">' +
                  '<div class="vocab-hint-ico">♪</div>' +
                  "<b>Tìm nhạc</b>" +
                  "Nhập tên bài hát hoặc nghệ sĩ<br>để tìm bài muốn nghe." +
                  "</div>";
              } else if (hm === "m") {
                var qn = stripTones(q);
                var r = all.filter(function (k) {
                  var tr = tracks[k];
                  var hay = stripTones(tr.t + " " + tr.a);
                  return hay.indexOf(qn) >= 0;
                });
                h = r.length
                  ? sec("Kết quả", r.length) + r.map(rowT).join("")
                  : '<div class="empty">Không tìm thấy bài nào<br><small>Thử tên khác</small></div>';
              } else if (hm === "w") {
                if (!all.length) {
                  h = '<div class="empty vocab-hint"><div class="vocab-hint-ico">♪</div><b>Chưa có bài hát</b>Hãy vào tab Tìm nhạc để nghe nhạc.</div>';
                } else {
                  all.sort(function (a, b) {
                    return (S.plays[tracks[b].t] || 0) - (S.plays[tracks[a].t] || 0);
                  });
                  var top = all.filter(function (k) { return (S.plays[tracks[k].t] || 0) > 0; });
                  var rest = all.filter(function (k) { return (S.plays[tracks[k].t] || 0) === 0; });
                  for (var si = rest.length - 1; si > 0; si--) {
                    var sj = Math.floor(Math.random() * (si + 1));
                    var tmp = rest[si]; rest[si] = rest[sj]; rest[sj] = tmp;
                  }
                  var show = top.concat(rest).slice(0, 40);
                  h = '<div class="sh">Đề xuất cho bạn <small>' + show.length + '</small> <button class="chip" data-a="refreshRec" style="margin-left:auto;font-size:12px;padding:4px 10px">Làm mới</button></div>' +
                    (top.length ? '<div style="padding:0 20px 6px;font-size:12px;color:var(--sub)">Dựa trên lượt nghe của bạn (lưu trên máy)</div>' : '') +
                    show.map(function (k, n) {
                      var tr = tracks[k];
                      var plays = S.plays[tr.t] || 0;
                      var coverHtml = tr.img
                        ? '<img class="row-cover" src="' + esc(tr.img) + '" alt="" />'
                        : '<div class="row-cover" style="background:linear-gradient(135deg,' + tr.c[0] + ',' + tr.w + ')"></div>';
                      return (
                        '<div class="row' + (k === i ? " cur" : "") + '" data-a="hplay" data-k="' + k + '" style="--k:' + n + '">' +
                        coverHtml +
                        '<div class="row-info"><b>' + esc(tr.t) + '</b><small>' + esc(tr.a) + (plays ? ' · ' + plays + ' lượt' : '') + '</small></div>' +
                        '<span class="row-dur">' + fmt(tr.d) + '</span></div>'
                      );
                    }).join("");
                }
              } else {
                h =
                  sec("Playlist của tôi", S.p.length) +
                  '<div class="cards">' +
                  S.p.map(function (p, k) {
                    var t = tracks[p.s[0]];
                    var g = t ? "linear-gradient(150deg," + t.c[0] + "," + t.w + ")" : "linear-gradient(150deg,#c7c7cc,#8e8e93)";
                    var bg = t && t.img ? "url('" + esc(t.img).replace(/'/g, "%27") + "') center/cover no-repeat, " + g : g;
                    return (
                      '<div class="pc-wrap">' +
                      '<button class="pc" data-a="hpl" data-k="p' + k + '" style="background:' + bg + '"><b>' +
                      esc(p.n) + "</b><small>" + p.s.length + " bài</small></button>" +
                      '<button class="pc-del" data-a="hdelpl" data-k="' + k + '" aria-label="Xoá playlist" title="Xoá">×</button>' +
                      "</div>"
                    );
                  }).join("") +
                  '<button class="pc new" data-a="hnew"><b>＋</b><small>Playlist mới</small></button></div>';

                if (creating) {
                  h += '<div class="add"><input id="hpn" maxlength="30" placeholder="Nhập tên playlist rồi nhấn Enter"></div>';
                }

                if (!S.p.length && !creating) {
                  h += '<div class="empty" style="padding-top:8px">Chưa có playlist.<br>Bấm ＋ để tạo playlist mới.</div>';
                }

                h += sec("Yêu thích", S.f.length) +
                  (S.f.length
                    ? S.f.map(rowT).join("")
                    : '<div class="empty">Bấm ♥ ở trình phát để lưu bài yêu thích</div>');
              }
              B.innerHTML = h;
              if (creating) {
                var inp = $("hpn");
                if (inp) inp.focus();
              }
            }

            $("hbody").onclick = function (e) {
              var b = e.target.closest("[data-a]");
              if (!b) return;
              var a = b.dataset.a, k = b.dataset.k;
              if (a === "hplay") playTrack(+k);
              else if (a === "hpl") open("q", k);
              else if (a === "hnew") {
                creating = !creating;
                renderHome(1);
              } else if (a === "hdelpl") {
                var idx = +k;
                if (idx < 0 || idx >= S.p.length) return;
                var name = S.p[idx].n;
                if (!confirm('Xoá playlist "' + name + '"?')) return;
                S.p.splice(idx, 1);
                save();
                toast('Đã xoá playlist "' + name + '"');
              } else if (a === "refreshRec") { renderHome(1); toast("Đã làm mới đề xuất"); }
            };

            // Tạo playlist: nhấn Enter trong ô nhập tên (không còn nút Tạo)
            $("hbody").addEventListener("keydown", function (e) {
              if (e.key === "Enter" && e.target.id === "hpn") homeCreate();
            });
            $("hbody").addEventListener("focusout", function (e) {
              if (e.target.id === "hpn" && !e.target.value.trim()) {
                creating = false;
                renderHome(1);
              }
            });

            function homeCreate() {
              var v = $("hpn").value.trim();
              if (!v) return;
              S.p.push({ n: v, s: [] });
              creating = false;
              save();
              toast('Đã tạo playlist "' + v + '"');
            }

            $("q").oninput = function () {
              hq = this.value;
              $("qc").hidden = !hq;
              renderHome(1);
            };
            $("qc").onclick = function () {
              hq = "";
              $("q").value = "";
              this.hidden = true;
              renderHome();
              $("q").focus();
            };

            document.querySelectorAll(".tab").forEach(function (b) {
              b.onclick = function () {
                hm = b.dataset.m;
                hq = "";
                creating = false;
                $("q").value = "";
                $("qc").hidden = true;
                $("sbox").hidden = hm === "me" || hm === "w";
                var fsH = $("fsBtnHome");
                if (fsH) fsH.hidden = hm !== "me";
                $("tabs").setAttribute("data-p", b.dataset.p);
                document.querySelectorAll(".tab").forEach(function (x) {
                  x.classList.toggle("on", x === b);
                });
                renderHome();
                $("hbody").scrollTop = 0;
              };
            });

            $("mini").onclick = openPlayer;
            $("mPlay").onclick = function (e) {
              e.stopPropagation();
              setPlaying(!playing);
            };

            // ========== SHEET ==========
            function open(m, arg) {
              mode = m;
              if (m === "q") tab = arg || "all";
              render();
              $("sheet").classList.add("open");
            }
            function close() {
              $("sheet").classList.remove("open");
              mode = "";
            }

            function render(na) {
              var P = $("pane"),
                h = '<div class="grab"></div>',
                tr = tracks[i];
              if (!tr) return;
              P.classList.toggle("na", !!na);
              P.classList.toggle("tall", mode === "ly" || mode === "q" || mode === "artist");

              if (mode === "q") {
                var ch = [["all", "Tất cả"], ["fav", "Yêu thích"]].concat(
                  S.p.map(function (p, k) { return ["p" + k, p.n]; })
                );
                var ids =
                  tab === "all" ? tracks.map(function (_, k) { return k; })
                  : tab === "fav" ? S.f
                  : (S.p[+tab.slice(1)] || { s: [] }).s;
                h +=
                  '<div class="hd">Danh sách phát</div><div class="chips">' +
                  ch.map(function (c) {
                    return '<button class="chip' + (c[0] === tab ? " on" : "") + '" data-a="tab" data-k="' + c[0] + '">' + esc(c[1]) + "</button>";
                  }).join("") +
                  '</div><div class="body">' +
                  (ids.length
                    ? ids.map(function (k, n) {
                        var coverHtml = tracks[k].img
                          ? '<img class="row-cover" src="' + esc(tracks[k].img) + '" alt="" />'
                          : '<div class="row-cover" style="background:linear-gradient(135deg,' + tracks[k].c[0] + "," + tracks[k].w + ')"></div>';
                        return (
                          '<div class="row' + (k === i ? " cur" : "") + '" data-a="play" data-k="' + k + '" style="--k:' + n + '">' +
                          coverHtml +
                          '<div class="row-info"><b>' + esc(tracks[k].t) + "</b><small>" + esc(tracks[k].a) + "</small></div>" +
                          '<span class="row-dur">' + fmt(tracks[k].d) + "</span></div>"
                        );
                      }).join("")
                    : '<div class="empty">Chưa có bài nào</div>') +
                  "</div>";
              } else if (mode === "a") {
                var rows = [["f", "Yêu thích", S.f.length, S.f.indexOf(i) >= 0]].concat(
                  S.p.map(function (p, k) { return [k, p.n, p.s.length, p.s.indexOf(i) >= 0]; })
                );
                h +=
                  '<div class="hd">Thêm vào playlist <small>' + esc(tr.t) + '</small></div><div class="body">' +
                  rows.map(function (x, n) {
                    return (
                      '<div class="row" data-a="tog" data-k="' + x[0] + '" style="--k:' + n + '"><div class="row-info"><b>' +
                      esc(x[1]) + "</b><small>" + x[2] + ' bài</small></div><span class="ck' + (x[3] ? " on" : "") + '">' +
                      (x[3] ? "✓" : "") + "</span></div>"
                    );
                  }).join("") +
                  '<div class="add"><input id="npl" maxlength="30" placeholder="Nhập tên playlist rồi nhấn Enter"></div></div>';
              } else if (mode === "artist") {
                var an = window._artistName || "";
                var ids2 = tracks.map(function (_, k) { return k; }).filter(function (k) {
                  var ta = (tracks[k].a || "").toLowerCase();
                  return ta.indexOf(an.toLowerCase()) >= 0 || an.toLowerCase().indexOf(ta) >= 0;
                });
                h +=
                  '<div class="hd">Bài của ' + esc(an) + ' <small>' + ids2.length + ' bài</small></div><div class="body">' +
                  (ids2.length
                    ? ids2.map(function (k, n) {
                        var t2 = tracks[k];
                        var coverHtml = t2.img
                          ? '<img class="row-cover" src="' + esc(t2.img) + '" alt="" />'
                          : '<div class="row-cover" style="background:linear-gradient(135deg,' + t2.c[0] + ',' + t2.w + ')"></div>';
                        return (
                          '<div class="row' + (k === i ? " cur" : "") + '" data-a="play" data-k="' + k + '" style="--k:' + n + '">' +
                          coverHtml +
                          '<div class="row-info"><b>' + esc(t2.t) + '</b><small>' + esc(t2.a) + '</small></div>' +
                          '<span class="row-dur">' + fmt(t2.d) + '</span></div>'
                        );
                      }).join("")
                    : '<div class="empty">Không tìm thấy bài nào của nghệ sĩ này</div>') +
                  "</div>";
              } else if (mode === "ly") {
                var lyList = tr.l || [];
                var lyHtml = lyList.map(function (sec) {
                  var singer = sec.s ? '<span class="singer">' + esc(sec.s) + "</span>\n" : "";
                  return singer + sec.lines.map(esc).join("\n");
                }).join("\n\n");
                h +=
                  '<div class="hd"><span>Lời bài hát <small>' + esc(tr.t) + "</small></span>" +
                  (lyList.length ? '<button class="chip" data-a="copy">Sao chép</button>' : "") +
                  "</div>" +
                  '<div class="body">' +
                  (lyList.length
                    ? '<div class="lytxt" id="lyt">' + lyHtml + "</div>"
                    : '<div class="empty">Bài này chưa có lời bài hát</div>') +
                  "</div>";
              } else return;
              var oc = mode === "q" && $("sheet").classList.contains("open") ? P.querySelector(".chips") : null;
              var sl = oc ? oc.scrollLeft : 0;
              P.innerHTML = h;
              if (oc) { var nc = P.querySelector(".chips"); if (nc) nc.scrollLeft = sl; }
              if (mode === "a") {
                var ni = $("npl");
                if (ni) {
                  ni.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") newPl();
                  });
                  ni.focus();
                }
              }
            }

            function copyLy() {
              var tr = tracks[i];
              var txt = tr.l.map(function (sec) {
                return (sec.s ? sec.s + "\n" : "") + sec.lines.join("\n");
              }).join("\n\n");
              function fb() {
                var r = document.createRange();
                r.selectNodeContents($("lyt"));
                var s = getSelection();
                s.removeAllRanges();
                s.addRange(r);
                try { document.execCommand("copy"); } catch (e) {}
                toast("Đã sao chép lời");
              }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(function () {
                  toast("Đã sao chép lời");
                }, fb);
              } else fb();
            }

            function togList(k) {
              if (k === "f") {
                togFav();
                render(1);
                return;
              }
              var a = S.p[+k].s, j = a.indexOf(i);
              if (j < 0) {
                a.push(i);
                toast('Đã thêm vào "' + S.p[+k].n + '"');
              } else {
                a.splice(j, 1);
                toast('Đã bỏ khỏi "' + S.p[+k].n + '"');
              }
              save();
              render(1);
            }

            function togFav() {
              var j = S.f.indexOf(i);
              if (j < 0) {
                S.f.push(i);
                toast("Đã thêm vào Yêu thích");
              } else {
                S.f.splice(j, 1);
                toast("Đã bỏ khỏi Yêu thích");
              }
              save();
              syncLike();
            }

            function newPl() {
              var inp = $("npl");
              if (!inp) return;
              var v = inp.value.trim();
              if (!v) return;
              S.p.push({ n: v, s: [i] });
              save();
              toast('Đã tạo playlist "' + v + '"');
              render(1);
            }

            $("pane").onclick = function (e) {
              var b = e.target.closest("[data-a]");
              if (!b) return;
              var a = b.dataset.a, k = b.dataset.k;
              if (a === "tab") {
                if (tab === k) return;
                tab = k;
                var body = $("pane").querySelector(".body");
                if (body) {
                  body.classList.add("sw");
                  setTimeout(function () { render(); }, 160);
                } else render();
              } else if (a === "play") {
                playTrack(+k);
                close();
              } else if (a === "tog") togList(k);
              else if (a === "copy") copyLy();
            };

            $("sheet").onclick = function (e) {
              if (e.target === this) close();
            };

            // ========== VUỐT XUỐNG ĐỂ THOÁT TRÌNH PHÁT ==========
            (function () {
              var np = $("np");
              var y0 = null, dy = 0, dragging = false;
              np.addEventListener("pointerdown", function (e) {
                if (e.target.closest("button, .seek, input, .sheet")) return;
                y0 = e.clientY; dy = 0; dragging = false;
                np.setPointerCapture(e.pointerId);
              });
              np.addEventListener("pointermove", function (e) {
                if (y0 === null) return;
                dy = e.clientY - y0;
                if (dy > 6) dragging = true;
                if (dragging && dy > 0) {
                  np.classList.add("dragging");
                  np.style.transform = "translateY(" + dy + "px)";
                }
              });
              function end(e) {
                if (y0 === null) return;
                var moved = dy;
                y0 = null;
                np.classList.remove("dragging");
                np.style.transform = "";
                if (dragging && moved > 90) closePlayer();
                dragging = false;
              }
              np.addEventListener("pointerup", end);
              np.addEventListener("pointercancel", end);
            })();

            // ========== CONTROLS ==========
            function seekTo(e) {
              var r = $("seek").getBoundingClientRect();
              var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
              var tr = tracks[i];
              var dur = (useAudio && audio.duration && isFinite(audio.duration) ? audio.duration : tr.d);
              pos = f * dur;
              if (useAudio) setT(pos);
              paint();
            }
            var drag = false;
            $("seek").addEventListener("pointerdown", function (e) {
              drag = true;
              this.setPointerCapture(e.pointerId);
              seekTo(e);
            });
            $("seek").addEventListener("pointermove", function (e) {
              if (drag) seekTo(e);
            });
            $("seek").addEventListener("pointerup", function () { drag = false; });

            $("play").onclick = function () { setPlaying(!playing); };
            $("prev").onclick = function () { step(-1); };
            $("next").onclick = function () { step(1); };
            $("shuffle").onclick = function () {
              shuffle = !shuffle;
              this.classList.toggle("on", shuffle);
              toast(shuffle ? "Phát ngẫu nhiên: Bật" : "Phát ngẫu nhiên: Tắt");
            };
            $("like").onclick = togFav;
            $("queue").onclick = function () { open("q"); };
            $("bA").onclick = function () { open("a"); };
            $("bL").onclick = function () { open("ly"); };

            $("share").onclick = function () {
              var tr = tracks[i];
              if (!tr) return;
              var text = tr.t + " – " + tr.a;
              if (navigator.share) {
                navigator.share({ title: text, text: text }).catch(function () {});
              } else {
                toast("Đã sao chép: " + text);
                if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
              }
            };

            function updateLoopBtn() {
              var btn = $("loopBtn");
              btn.classList.toggle("on", repeat > 0);
              btn.innerHTML = repeat === 2 ? ICON_LOOP1 : ICON_LOOP;
              btn.setAttribute("aria-label", repeat === 0 ? "Lặp lại: Tắt" : repeat === 1 ? "Lặp lại: Tất cả" : "Lặp lại: Một bài");
            }
            $("loopBtn").onclick = function () {
              repeat = (repeat + 1) % 3;
              updateLoopBtn();
              toast(repeat === 0 ? "Lặp lại: Tắt" : repeat === 1 ? "Lặp lại: Tất cả" : "Lặp lại: Một bài");
            };
            updateLoopBtn();

            function clearSleep() {
              if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
              sleepMins = 0;
              var tb = $("timerBtn");
              tb.classList.remove("on");
              tb.setAttribute("aria-label", "Hẹn giờ");
            }
            $("timerBtn").onclick = function () {
              var opts = [0, 15, 30, 45, 60];
              var idx = opts.indexOf(sleepMins);
              sleepMins = opts[(idx + 1) % opts.length];
              if (sleepTimer) clearTimeout(sleepTimer);
              if (sleepMins === 0) {
                clearSleep();
                toast("Hẹn giờ: Tắt");
                return;
              }
              $("timerBtn").classList.add("on");
              $("timerBtn").setAttribute("aria-label", "Hẹn giờ: " + sleepMins + " phút");
              sleepTimer = setTimeout(function () {
                setPlaying(false);
                clearSleep();
                toast("Đã hết giờ – tạm dừng");
              }, sleepMins * 60 * 1000);
              toast("Hẹn giờ: " + sleepMins + " phút");
            };

            function isFs() {
              return !!(document.fullscreenElement || document.webkitFullscreenElement);
            }
            function updateFsBtn() {
              var btn = $("fsBtnHome");
              if (!btn) return;
              btn.innerHTML = isFs() ? ICON_FS_EXIT : ICON_FS;
              btn.setAttribute("aria-label", isFs() ? "Thoát toàn màn hình" : "Toàn màn hình");
            }
            $("fsBtnHome").onclick = function () {
              if (isFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
              } else {
                var el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
              }
            };
            document.addEventListener("fullscreenchange", updateFsBtn);
            document.addEventListener("webkitfullscreenchange", updateFsBtn);

            $("artist").onclick = function () {
              var name = this.dataset.artist || this.textContent;
              if (!name) return;
              openArtist(name);
            };
            function openArtist(name) {
              mode = "artist";
              window._artistName = name;
              render();
              $("sheet").classList.add("open");
            }

            if ("mediaSession" in navigator) {
              try {
                navigator.mediaSession.setActionHandler("play", function () { setPlaying(true); });
                navigator.mediaSession.setActionHandler("pause", function () { setPlaying(false); });
                navigator.mediaSession.setActionHandler("previoustrack", function () { step(-1); });
                navigator.mediaSession.setActionHandler("nexttrack", function () { step(1); });
              } catch (e) {}
            }

            // ========== INIT ==========
            // Ngay khi mở web: lấy danh sách nhạc rồi phát ngẫu nhiên một bài
            pos = 0;
            setPlaying(true);
            renderHome();
            loadGitHubFiles(function () {
              if (tracks.length) {
                load(Math.floor(Math.random() * tracks.length));
              } else {
                load(0);
              }
              renderHome(1);
            });

            // Đăng ký service worker để cache nhạc/ảnh trong bộ nhớ đệm của trình duyệt
            if ("serviceWorker" in navigator) {
              window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js").catch(function () {});
